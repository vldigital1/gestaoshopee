function persistGoal(value, isNew){
  const now = new Date().toISOString();
  S.goals.monthly = value;
  if (isNew || !S.goals.createdAt) S.goals.createdAt = now;
  S.goals.updatedAt = now;
  save();
}

function bindMetas(el){
  const close = el.querySelector('#metasInfoClose');
  if (close) close.onclick = ()=>{ localStorage.setItem('metasInfoDismissed','1'); el.querySelector('#metasInfo')?.remove(); };

  const editBtn = el.querySelector('#editGoal');
  if (editBtn) editBtn.onclick = ()=> openEditGoalModal();

  const resetBtn = el.querySelector('#resetGoal');
  if (resetBtn) resetBtn.onclick = ()=> openResetGoalModal();

  const defineBtn = el.querySelector('#defineGoal');
  if (defineBtn) defineBtn.onclick = ()=> openEditGoalModal();
  const defineBtnTop = el.querySelector('#defineGoalBtn');
  if (defineBtnTop) defineBtnTop.onclick = ()=> openEditGoalModal();
}

function openEditGoalModal(){
  const current = S.goals.monthly||0;
  const isNew = current<=0;
  openModal(`
    <div class="p-6 max-w-md">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-ink">${isNew?'Definir meta mensal':'Alterar meta mensal'}</h3>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 text-ink-mute flex items-center justify-center">×</button>
      </div>
      <label class="text-sm block">Valor da Meta
        <input id="editGoalInput" inputmode="numeric" autocomplete="off" class="mt-1 block w-full border border-slate-200 rounded-xl px-3 py-3 text-lg font-semibold tabular-nums focus:outline-none focus:border-shopee/50"/>
      </label>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeModal()" class="border border-slate-200 px-4 py-2 rounded-xl text-sm font-semibold text-ink-soft hover:border-slate-300">Cancelar</button>
        <button id="editGoalSave" class="btn-primary px-4 py-2 rounded-xl text-sm font-semibold">Salvar Meta</button>
      </div>
    </div>
  `);
  const inp = document.getElementById('editGoalInput');
  attachBRLMask(inp, current);
  setTimeout(()=>inp?.focus(),0);
  const doSave = ()=>{
    const v = brlMaskToNumber(inp.value);
    if (v<=0){ toast('Informe um valor válido.','warn'); return; }
    persistGoal(v, isNew);
    closeModal();
    render();
    toast('Meta salva.','ok');
  };
  document.getElementById('editGoalSave').onclick = doSave;
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') doSave(); });
}

function openResetGoalModal(){
  openModal(`
    <div class="p-6 max-w-md">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-lg font-bold text-ink">Redefinir meta?</h3>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 text-ink-mute flex items-center justify-center">×</button>
      </div>
      <p class="text-sm text-ink-soft">Ao redefinir sua meta, o objetivo atual será removido e todos os cálculos relacionados serão reiniciados.</p>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeModal()" class="border border-slate-200 px-4 py-2 rounded-xl text-sm font-semibold text-ink-soft hover:border-slate-300">Cancelar</button>
        <button id="resetGoalConfirm" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">Sim, redefinir</button>
      </div>
    </div>
  `);
  document.getElementById('resetGoalConfirm').onclick = ()=>{
    S.goals = { monthly: 0, createdAt: null, updatedAt: null };
    save();
    closeModal();
    render();
    toast('Meta redefinida.','ok');
  };
}

/* Relatórios Shopee — histórico acumulado */
function viewShopeeReports(el){
  const summaries = S.imports.map(i=>{
    const s = computeImportSummary(i.id);
    if (!s) return null;
    const inv = s.imp.adInvestment||0;
    const net = s.commission - inv;
    const roas = inv>0 ? s.commission/inv : null;
    return { ...s, inv, net, roas };
  }).filter(Boolean);

  // Dedup by hash for accumulated totals
  const seen = new Set();
  const uniq = summaries.filter(x=>{ const h=x.imp.hash||x.imp.id; if(seen.has(h))return false; seen.add(h); return true; });
  const totalReports = summaries.length;
  const accCommission = uniq.reduce((a,b)=>a+b.commission,0);
  const accInvestment = uniq.reduce((a,b)=>a+b.inv,0);
  const accNet = accCommission - accInvestment;

  const kpi = (label, value, tint, iconName)=>`
    <div class="bg-white rounded-2xl p-4 shadow-card border border-slate-100/60 relative overflow-hidden slide-in">
      <div class="absolute inset-0 bg-gradient-to-br ${tint} opacity-60"></div>
      <div class="relative">
        <div class="flex items-center gap-2 text-[10px] uppercase tracking-wider font-bold text-ink-mute">${icon(iconName,'w-3.5 h-3.5')} ${label}</div>
        <div class="mt-1 text-2xl font-black text-ink tabular-nums">${value}</div>
      </div>
    </div>`;

  el.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
      ${kpi('Total de Relatórios', fmtInt(totalReports), 'from-shopee/15 to-shopee/5','folder')}
      ${kpi('Comissões Acumuladas', fmtBRL(accCommission), 'from-emerald-500/15 to-emerald-500/5','money')}
      ${kpi('Investimento Total', fmtBRL(accInvestment), 'from-slate-500/15 to-slate-500/5','money')}
      ${kpi('Margem Líquida', fmtBRL(accNet), accNet>=0?'from-emerald-500/15 to-emerald-500/5':'from-rose-500/15 to-rose-500/5','trending')}
    </div>

    <div class="bg-white rounded-2xl p-4 shadow-card border border-slate-100/60 mb-4 slide-in">
      <div class="grid grid-cols-1 md:grid-cols-5 gap-2">
        <label class="text-xs font-semibold text-ink-soft">Data inicial<input id="rs-start" type="date" class="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-shopee/50"/></label>
        <label class="text-xs font-semibold text-ink-soft">Data final<input id="rs-end" type="date" class="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-shopee/50"/></label>
        <label class="text-xs font-semibold text-ink-soft md:col-span-3">Buscar (arquivo, produto, SubID ou canal)<input id="rs-q" type="text" placeholder="ex.: fone bluetooth, sub123..." class="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-shopee/50"/></label>
      </div>
      <div class="flex justify-end gap-2 mt-3">
        <button id="rs-clear" class="border border-slate-200 px-3 py-2 rounded-xl text-xs font-semibold text-ink-soft hover:bg-slate-50">Limpar</button>
        <button id="rs-apply" class="btn-primary px-4 py-2 rounded-xl text-xs font-bold">Aplicar filtros</button>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-card border border-slate-100/60 overflow-hidden slide-in">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-ink flex items-center gap-2">${icon('folder','w-4 h-4 text-shopee')} Histórico de Relatórios</h3>
        <span id="rs-count" class="text-xs text-ink-mute font-semibold"></span>
      </div>
      <div id="rs-table" class="overflow-x-auto"></div>
    </div>
  `;

  const q = el.querySelector('#rs-q');
  const ds = el.querySelector('#rs-start');
  const de = el.querySelector('#rs-end');

  const rowMatches = (s, term, ds, de)=>{
    if (ds && s.dateMax && s.dateMax < ds) return false;
    if (de && s.dateMin && s.dateMin > de) return false;
    if (!term) return true;
    const t = term.toLowerCase();
    if (s.imp.filename.toLowerCase().includes(t)) return true;
    if (s.imp.type.toLowerCase().includes(t)) return true;
    const salesR = S.sales.filter(x=>x.importId===s.imp.id);
    const clicksR = S.clicks.filter(x=>x.importId===s.imp.id);
    if (salesR.some(x=>(x.product||'').toLowerCase().includes(t))) return true;
    if (salesR.some(x=>(x.subid||'').toLowerCase().includes(t))) return true;
    if (clicksR.some(x=>(x.subid||'').toLowerCase().includes(t))) return true;
    if (clicksR.some(x=>(x.source||'').toLowerCase().includes(t))) return true;
    return false;
  };

  const paint = ()=>{
    const term = (q.value||'').trim();
    const dsV = ds.value||''; const deV = de.value||'';
    const list = summaries.slice().reverse().filter(s=>rowMatches(s, term, dsV, deV));
    el.querySelector('#rs-count').textContent = `${list.length} relatório(s)`;
    const host = el.querySelector('#rs-table');
    if (!list.length){
      host.innerHTML = `<div class="p-8 text-center text-sm text-ink-mute">Nenhum relatório encontrado. Importe um CSV em <b class="text-shopee">Importar</b>.</div>`;
      return;
    }
    host.innerHTML = `
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-[11px] uppercase text-ink-mute tracking-wider">
          <tr>
            <th class="px-3 py-2 text-left">Data</th>
            <th class="px-3 py-2 text-left">Período</th>
            <th class="px-3 py-2 text-left">Tipo</th>
            <th class="px-3 py-2 text-left">Arquivo</th>
            <th class="px-3 py-2 text-right">Pedidos</th>
            <th class="px-3 py-2 text-right">Comissão</th>
            <th class="px-3 py-2 text-right">Investimento</th>
            <th class="px-3 py-2 text-right">Margem</th>
            <th class="px-3 py-2 text-right">ROAS</th>
            <th class="px-3 py-2 text-center">Status</th>
            <th class="px-3 py-2 text-right">Ações</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(s=>{
            const st = roiStatus(s.net);
            const period = s.dateMin ? `${fmtDateBR(s.dateMin)} → ${fmtDateBR(s.dateMax)}` : '—';
            return `<tr class="border-t border-slate-100 hover:bg-slate-50/60">
              <td class="px-3 py-2 whitespace-nowrap text-ink-soft">${fmtDateBR(dayKey(new Date(s.imp.importedAt)))}</td>
              <td class="px-3 py-2 whitespace-nowrap text-ink-soft">${period}</td>
              <td class="px-3 py-2"><span class="bg-shopee-bg text-shopee text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">${s.imp.type}</span></td>
              <td class="px-3 py-2 max-w-[220px] truncate" title="${escapeHtml(s.imp.filename)}">${escapeHtml(s.imp.filename)}</td>
              <td class="px-3 py-2 text-right tabular-nums">${fmtInt(s.orders)}</td>
              <td class="px-3 py-2 text-right tabular-nums font-semibold text-emerald-700">${fmtBRL(s.commission)}</td>
              <td class="px-3 py-2 text-right tabular-nums">${fmtBRL(s.inv)}</td>
              <td class="px-3 py-2 text-right tabular-nums font-bold ${s.net>=0?'text-emerald-700':'text-rose-700'}">${fmtBRL(s.net)}</td>
              <td class="px-3 py-2 text-right tabular-nums">${s.roas!=null?s.roas.toFixed(2)+'x':'—'}</td>
              <td class="px-3 py-2 text-center"><span class="stt ${st.k==='lucro'?'stt-alta':st.k==='prejuizo'?'stt-atencao':'stt-estavel'}">${st.l}</span></td>
              <td class="px-3 py-2 text-right whitespace-nowrap">
                <button data-view="${s.imp.id}" title="Visualizar detalhes" class="p-1.5 rounded-lg hover:bg-shopee-bg text-shopee">${icon('sparkle','w-4 h-4')}</button>
                <button data-csv="${s.imp.id}" title="Exportar CSV" class="p-1.5 rounded-lg hover:bg-slate-100 text-ink-soft">${icon('folder','w-4 h-4')}</button>
                <button data-pdf="${s.imp.id}" title="Baixar resumo PDF" class="p-1.5 rounded-lg hover:bg-slate-100 text-ink-soft">${icon('trending','w-4 h-4')}</button>
                <button data-del="${s.imp.id}" title="Excluir" class="p-1.5 rounded-lg hover:bg-rose-50 text-rose-600">${icon('trash','w-4 h-4')}</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;
    host.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openAnalysisModal(b.dataset.view));
    host.querySelectorAll('[data-csv]').forEach(b=>b.onclick=()=>{
      const id = b.dataset.csv;
      const rows = [...S.sales, ...S.daily, ...S.clicks].filter(x=>x.importId===id);
      downloadBlob(Papa.unparse(rows), `relatorio-${id}.csv`, 'text/csv');
    });
    host.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>exportImportPDF(b.dataset.pdf));
    host.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      const id = b.dataset.del;
      uiConfirm({title:'Excluir este relatório?', desc:'Os dados vinculados também serão removidos permanentemente.', okText:'Excluir', danger:true}, ()=>deleteImport(id));
    });
  };

  el.querySelector('#rs-apply').onclick = paint;
  el.querySelector('#rs-clear').onclick = ()=>{ q.value=''; ds.value=''; de.value=''; paint(); };
  q.oninput = paint;
  paint();
}

function exportImportPDF(importId){
  const s = computeImportSummary(importId); if(!s) return;
  const inv = s.imp.adInvestment||0;
  const net = s.commission - inv;
  const roas = inv>0 ? (s.commission/inv).toFixed(2)+'x' : '—';
  const roi = inv>0 ? ((net/inv)*100).toFixed(1)+'%' : '—';
  const period = s.dateMin?`${fmtDateBR(s.dateMin)} → ${fmtDateBR(s.dateMax)}`:'—';
  const html = `<html><head><title>Resumo do relatório</title><style>body{font-family:Inter,sans-serif;padding:32px;color:#0F172A}h1{color:#5B4FE5;margin:0 0 8px}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{border:1px solid #E2E8F0;padding:10px;font-size:14px;text-align:left}th{background:#F8FAFC}</style></head><body>
    <h1>Shopee Analytics — Resumo</h1>

function downloadBlob(content, name, type){
  const b = new Blob([content],{type}); const url = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);
}

function biaTipFor(id){ return BIA_TIPS[id] || 'Explore o menu lateral para descobrir todas as funcionalidades disponíveis.'; }

function biaRelated(excludeId){
  const pool = HELP_TOPICS.filter(t=>t.id!==excludeId);
  const pick = [];
  const used = new Set();
  while (pick.length<3 && used.size<pool.length){
    const i = Math.floor(Math.random()*pool.length);
    if (used.has(i)) continue; used.add(i); pick.push(pool[i]);
  }
  return pick;
}

  const related = biaRelated(t.id);
  const chips = related.map(r=>`<button data-bia-quick="${r.id}" class="px-2.5 py-1 rounded-full border border-slate-200 bg-white text-[11px] text-ink-soft hover:border-shopee/40 hover:text-shopee transition">${escapeHtml(r.title)}</button>`).join('');
  return `
    <div class="text-[13px] font-bold text-shopee mb-1">${escapeHtml(t.title)}</div>
    <div class="text-[12.5px] text-ink leading-relaxed [&_ul]:list-disc [&_ul]:pl-4 [&_ol]:list-decimal [&_ol]:pl-4 [&_li]:mb-0.5 [&_p]:mb-1.5">${body}</div>

}

function biaTypingDelay(html){
  const len = String(html||'').replace(/<[^>]+>/g,'').length;
  let min, max;
  if (len < 160)      { min=1500; max=2000; }
  else if (len < 500) { min=2000; max=3000; }
  else                { min=3000; max=4000; }
  return Math.round(min + Math.random()*(max-min));
}

function biaSubmit(){
  const inp = document.getElementById('biaInput'); if(!inp) return;
  const text = inp.value.trim(); if(!text) return;
  inp.value=''; _biaChat.push({role:'user', text}); _biaChat.push({role:'typing'}); renderBia();
  const reply = biaAnswer(text);
  setTimeout(()=>{
    _biaChat = _biaChat.filter(m=>m.role!=='typing');
    _biaChat.push({role:'bot', html: reply});
    renderBia();
  }, biaTypingDelay(reply));
}

function biaAskTopic(id){
  const t = HELP_TOPICS.find(x=>x.id===id);
  const quick = (typeof BIA_QUICK!=='undefined') ? BIA_QUICK.find(q=>q[1]===id) : null;
  const userText = t ? t.title : (quick ? String(quick[0]).replace(/^[^\wÀ-ÿ]+\s*/,'') : id);
  _biaChat.push({role:'user', text: userText});
  _biaChat.push({role:'typing'}); renderBia();
  const reply = t ? biaFormatTopic(t) : biaAnswer(userText);
  setTimeout(()=>{
    _biaChat = _biaChat.filter(m=>m.role!=='typing');
    _biaChat.push({role:'bot', html: reply});
    renderBia();
  }, biaTypingDelay(reply));
}

function biaAnswer(q){
  const s = q.toLowerCase();
  const hit = HELP_TOPICS.find(t=>{
    const hay = (t.title+' '+t.keywords.join(' ')+' '+t.desc).toLowerCase();
    return t.keywords.some(k=>s.includes(k)) || s.includes(t.id) || s.includes(t.title.toLowerCase()) || hay.split(' ').some(w=>w.length>3 && s.includes(w));
  });
  if (hit) return biaFormatTopic(hit);
  const faq = HELP_FAQ.find(f=>{
    const w = f[0].toLowerCase();
    return w.split(' ').some(x=>x.length>3 && s.includes(x));
  });
  if (faq) return `<div class="text-[13px] font-bold text-shopee mb-1">${escapeHtml(faq[0])}</div><div class="text-[12.5px] text-ink leading-relaxed">${faq[1]}</div>`;
  return `<div class="text-[12.5px] text-ink leading-relaxed">Ainda não encontrei essa resposta. Posso te ajudar com o funcionamento do <b>Shopee Analytics</b>. Experimente perguntar sobre:</div>
    <div class="mt-2 flex flex-wrap gap-1.5">
      ${BIA_QUICK.slice(0,6).map(([l,id])=>`<button data-bia-quick="${id}" class="px-2.5 py-1 rounded-full border border-slate-200 bg-white text-[11px] text-ink-soft hover:border-shopee/40 hover:text-shopee transition">${l}</button>`).join('')}
    </div>`;
}

  };
}

/* ============ ANÁLISE DE CANAIS ============ */
const CHANNEL_COLORS = {
  'Instagram':'#E1306C','Facebook':'#1877F2','WhatsApp':'#25D366','Telegram':'#0088CC',
  'TikTok':'#111827','YouTube':'#FF0000','Pinterest':'#E60023','Kwai':'#F87700',
  'Shopee Vídeo':'#5B4FE5','Websites':'#6366F1','Outros':'#64748B',
  'Sem canal identificado':'#94A3B8'
};
function channelColor(name){ return CHANNEL_COLORS[name] || '#64748B'; }

// Channel from CLICKS report: use referrer/source (never SubID).
function channelFromClick(c){
  const src = (c.source || c.referrer || '').toString();
  const name = classifyReferrer(src);
  if (name === 'Sem origem identificada') return 'Sem canal identificado';
  return name;
}
// Channel from SALES: prefer the "Canal" column when present in the CSV.
// Fallback: look up SubID in the user's registry (S.subids) to find the
// linked channel. When neither exists, mark as "Sem canal identificado".
function channelFromSale(s, subRegistry){
  const direct = (s.channel||'').trim();
  if (direct) return direct;
  const sub = (s.subid||'').trim().toLowerCase();
  if (!sub) return 'Sem canal identificado';
  const reg = subRegistry.get(sub);
  const ch = (reg && reg.channel || '').trim();
  return ch || 'Sem canal identificado';
}
// Compact number formatter for large values: 96,6 mi / 985 mil / 12,4 mil
function fmtCompact(n){
  const v = Number(n)||0; const a = Math.abs(v);
  const fmt = (x,s)=>{ const r=(v/x); const d=Math.abs(r)>=100?0:Math.abs(r)>=10?1:1; return r.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+' '+s; };
  if (a>=1e9) return fmt(1e9,'bi');
  if (a>=1e6) return fmt(1e6,'mi');
  if (a>=1e3) return fmt(1e3,'mil');
  return v.toLocaleString('pt-BR');
}
function fmtBRLCompact(n){
  const v=Number(n)||0; const a=Math.abs(v);
  if (a>=1e6) return 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';
  if (a>=1e3) return 'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil';
  return fmtBRL(v);
}

function viewCanais(el){
  const range = rangeForPeriod(S.settings.period);
  const salesR = S.sales.filter(s=>inRange(s.date, range.start, range.end));

  // Registry: SubID (lowercased) → cadastro entry (fallback for attribution)
  const subRegistry = new Map();
  (S.subids||[]).forEach(x=>{ if(x.subid) subRegistry.set(String(x.subid).trim().toLowerCase(), x); });

  // Group sales by channel
  const chMap = new Map();
  const ensure = (name) => {
    let cur = chMap.get(name);
    if (!cur){
      cur = { name, color: channelColor(name), commission:0, orderValue:0, items:0,
        orders:new Set(), products:new Map() };
      chMap.set(name, cur);
    }
    return cur;
  };
  salesR.forEach(s=>{
    const cur = ensure(channelFromSale(s, subRegistry));
    cur.commission += s.commission||0;
    cur.orderValue += s.orderValue||0;
    cur.items += s.itemsSold||0;
    if (s.orderId) cur.orders.add(s.orderId);
    const pk = s.product || '—';
    const pc = cur.products.get(pk) || { product:pk, commission:0, orders:new Set() };

    cur.products.set(pk, pc);

/* ============ ASSISTENTE INTELIGENTE (offline, consultor de performance) ============ */
function firstName(){ return (S.profile.name||'Afiliado').trim().split(/\s+/)[0] || 'Afiliado'; }
function pick1(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* Abertura conversacional, sensível ao tom do período */
function assistantTone(c){
  if (!c || c.totalRows===0) return 'empty';
  let score = 0;
  if (c.commDelta!==null){ if (c.commDelta>=0.1) score+=2; else if (c.commDelta>=0.03) score+=1; else if (c.commDelta<=-0.1) score-=2; else if (c.commDelta<=-0.03) score-=1; }
  if (c.orderDelta!==null){ if (c.orderDelta>=0.1) score+=1; else if (c.orderDelta<=-0.1) score-=1; }
  if (c.t.conv>=0.02) score+=1; else if (c.t.clicks>100 && c.t.conv<0.005) score-=1;
  if (score>=2) return 'great';
  if (score>=1) return 'positive';
  if (score<=-2) return 'bad';
  if (score<=-1) return 'attention';
  return 'neutral';
}

      `Separei os pontos mais importantes do seu desempenho, ${n}.`
    ],
    neutral: [
      `Oi, ${n}! Analisei seu relatório e encontrei alguns pontos bem interessantes.`,
      `Olha só, ${n}. Analisei seus números e encontrei oportunidades importantes.`,

      `Há espaço para melhorar, ${n}, e vou mostrar exatamente onde.`
    ],
    bad: [

      `${n}, este período foi difícil — vamos olhar juntos o que dá para ajustar.`,
      `Encontrei quedas importantes, ${n}, mas também caminhos para recuperar o ritmo.`

  };

}

function assistantContext(){
  const range = rangeForPeriod(S.settings.period);
  const t = totalsInRange(range);
  const prev = totalsInRange(previousRange(range));
  const series = dailySeries(range);
  const withComm = series.filter(d=>d.commission>0);
  const best = series.slice().sort((a,b)=>b.commission-a.commission)[0];
  const worst = withComm.slice().sort((a,b)=>a.commission-b.commission)[0] || series[0];
  const tp = topProducts(range,5);
  const ts = topSubids(range,5);
  const commDelta = prev.commission>0 ? (t.commission-prev.commission)/prev.commission : null;
  const clickDelta = prev.clicks>0 ? (t.clicks-prev.clicks)/prev.clicks : null;
  const orderDelta = prev.orders>0 ? (t.orders-prev.orders)/prev.orders : null;
  const convDelta = prev.conv>0 ? (t.conv-prev.conv)/prev.conv : null;
  const totalRows = S.sales.length + S.clicks.length + S.daily.length;
  const goalPct = S.goals.monthly>0 ? t.commission/S.goals.monthly : 0;
  const activeDays = withComm.length || 1;
  const avgDaily = t.commission / activeDays;
  // dias restantes do mês (para meta)
  const now = new Date();
  const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const daysLeftMonth = Math.max(1, lastDay - now.getDate() + 1);
  // produtos com muitos cliques e poucas vendas (usa sales agregado)
  const weakProducts = tp.filter(p=>p.items<=1 && p.commission>0).slice(0,3);
  return { n:firstName(), range, t, prev, series, best, worst, tp, ts,
    commDelta, clickDelta, orderDelta, convDelta, totalRows, goalPct,
    avgDaily, daysLeftMonth };
}

function fmtDelta(d){ if (d===null||d===undefined) return ''; const p=(d*100).toFixed(1); return (d>=0?'+':'')+p+'%'; }

function assistantScore(c){
  if (!c || c.totalRows===0) return { score:0, label:'Sem dados', color:'slate' };
  let s = 50;
  if (c.commDelta!==null) s += Math.max(-15, Math.min(20, c.commDelta*60));
  else if (c.t.commission>0) s += 5;
  if (c.t.conv>=0.02) s += 12; else if (c.t.conv>=0.01) s += 6; else if (c.t.clicks>50) s -= 8;
  if (c.t.ticket>=50) s += 8; else if (c.t.ticket>=25) s += 4; else if (c.t.ticket>0 && c.t.ticket<15) s -= 4;
  const activeRatio = (c.series.filter(d=>d.commission>0).length) / Math.max(1,c.series.length);
  s += Math.round((activeRatio-0.4)*20);
  if (c.orderDelta!==null) s += Math.max(-8, Math.min(10, c.orderDelta*30));
  if (c.clickDelta!==null) s += Math.max(-6, Math.min(8, c.clickDelta*20));
  s = Math.max(5, Math.min(99, Math.round(s)));
  const label = s>=80?'Excelente':s>=65?'Boa':s>=45?'Pode melhorar':'Atenção';
  const color = s>=80?'emerald':s>=65?'green':s>=45?'amber':'rose';
  return { score:s, label, color };
}
function assistantChartRead(c){
  const w = c.series.filter(d=>d.commission>0);
  if (w.length<3) return null;
  const half = Math.max(1, Math.floor(c.series.length/2));
  const a = c.series.slice(0,half).reduce((x,d)=>x+d.commission,0);
  const b = c.series.slice(half).reduce((x,d)=>x+d.commission,0);
  const trend = b>a*1.15?'crescimento':b<a*0.85?'queda':'estabilidade';
  const sorted = c.series.slice().sort((x,y)=>y.commission-x.commission);
  let acc=0, k=0; const total=c.t.commission||1;
  for (const d of sorted){ if (d.commission<=0) break; acc+=d.commission; k++; if (acc>=total*0.6) break; }
  const concentration = k / Math.max(1,c.series.length);
  return { trend, peak:c.best, bottom:c.worst, concentration, k, totalDays:c.series.length };
}
function assistantOpportunities(c){
  const out = [];
  if (c.commDelta!==null && c.commDelta>=0.1) out.push({type:'blue', text:`Ponto forte: sua comissão subiu ${(c.commDelta*100).toFixed(1)}% em relação ao período anterior.`});
  else if (c.t.ticket>=30) out.push({type:'blue', text:`Ponto forte: seu ticket médio (${fmtBRL(c.t.ticket)}) segue saudável.`});
  else if (c.t.orders>0 && c.t.commission>0 && c.t.orders<=5 && c.t.ticket>=20) out.push({type:'blue', text:`Ponto forte: mesmo com poucos pedidos, sua comissão segue consistente.`});
  if (c.t.clicks>100 && c.t.conv>0 && c.t.conv<0.01) out.push({type:'green', text:`Oportunidade: ${fmtInt(c.t.clicks)} cliques com apenas ${fmtPct(c.t.conv)} de conversão. Vale revisar produtos e criativos.`});
  else if (c.clickDelta!==null && c.clickDelta>0.1 && c.orderDelta!==null && c.orderDelta<c.clickDelta-0.05) out.push({type:'green', text:`Oportunidade: cliques cresceram, mas pedidos não acompanharam. Vale revisar o que está sendo divulgado.`});
  else if (c.tp[0]) out.push({type:'green', text:`Oportunidade: escale "${(c.tp[0].name||'').slice(0,40)}" — já rendeu ${fmtBRL(c.tp[0].commission)}.`});
  if (c.commDelta!==null && c.commDelta<=-0.1) out.push({type:'yellow', text:`Atenção: comissão caiu ${Math.abs(c.commDelta*100).toFixed(1)}% em relação ao período anterior.`});
  else if (c.clickDelta!==null && c.clickDelta<=-0.15) out.push({type:'yellow', text:`Atenção: seus cliques recuaram ${Math.abs(c.clickDelta*100).toFixed(1)}% — reforce postagens e stories.`});
  else if (c.t.ticket>0 && c.t.ticket<15) out.push({type:'yellow', text:`Atenção: ticket médio abaixo de R$ 15 — inclua produtos de maior valor no mix.`});
  if (c.best && c.best.commission>0 && c.t.commission>0){

    if (pct>=8) out.push({type:'trophy', text:`Melhor conquista: ${fmtDateBR(c.best.key)} respondeu por ${pct.toFixed(1)}% da comissão total (${fmtBRL(c.best.commission)}).`});
  }
  return out.slice(0,4);
}
function assistantSmartSummary(c){
  if (!c || c.totalRows===0) return 'Ainda não há dados importados — envie um CSV para eu começar a análise.';
  const parts = [];
  if (c.commDelta!==null && c.commDelta>=0.05) parts.push('período em ritmo positivo');
  else if (c.commDelta!==null && c.commDelta<=-0.05) parts.push('período pede ajustes na comissão');
  else if (c.t.commission>0) parts.push('resultado estável no período');
  if (c.t.ticket>=30) parts.push('ticket médio saudável');
  else if (c.t.ticket>0 && c.t.ticket<15) parts.push('ticket médio ainda baixo');
  if (c.t.clicks>100 && c.t.conv<0.01) parts.push('conversão precisa evoluir');
  else if (c.t.conv>=0.02) parts.push('boa taxa de conversão');
  const chart = assistantChartRead(c);
  if (chart && chart.concentration>0 && chart.concentration<0.25) parts.push('poucos dias concentram a maior parte da comissão');
  if (!parts.length) parts.push('primeiros dados registrados — importe mais para uma análise completa');
  const base = parts.join('; ');
  return base.charAt(0).toUpperCase() + base.slice(1) + '.';
}

function detectIntent(q){
  const s = ' '+(q||'').toLowerCase().replace(/[?!.,;:]/g,' ').replace(/\s+/g,' ').trim()+' ';
  let best = null, bestScore = 0;
  for (const it of INTENTS){
    for (const k of it.kws){
      if (s.indexOf(k) !== -1){
        // frases multi-palavra vencem termos genéricos
        const score = k.length + (k.includes(' ') ? 20 : 0);
        if (score > bestScore){ bestScore = score; best = it.name; }
      }
    }
  }
  return best;
}

  if (!c.tp.length) return `${n}, ainda não há vendas de produtos registradas no período. Importe um relatório de vendas para eu analisar.`;
  const top = c.tp[0];
  const linhas = c.tp.slice(0,5).map((p,i)=>`${i+1}. ${p.name} — ${fmtBRL(p.commission)} (${fmtInt(p.items)} itens)`);
  return pick1([
    `${n}, seu produto campeão é "${top.name}", com ${fmtBRL(top.commission)} em ${fmtInt(top.items)} itens. Top 5:\n${linhas.join('\n')}\n\nMinha sugestão: reforçar divulgação nesses produtos e testar variações do mesmo formato.`,
    `Analisando produtos, ${n}: destaque para "${top.name}" (${fmtBRL(top.commission)}). Ranking:\n${linhas.join('\n')}\n\nEu recomendo estudar o que funciona no ${top.name} e replicar no restante do catálogo.`
  ]);
}
function ansFraco(c){
  const n=c.n;
  if (!c.tp.length) return `${n}, ainda não tenho dados suficientes de produtos para apontar os fracos.`;
  const fracos = c.tp.filter(p=>p.items<=1).slice(0,3);
  if (!fracos.length) return `${n}, boa notícia: nenhum produto do seu top está performando abaixo do esperado.`;
  return `${n}, os seguintes produtos aparecem com pouco volume:\n${fracos.map((p,i)=>`${i+1}. ${p.name} — ${fmtInt(p.items)} item(s), ${fmtBRL(p.commission)}`).join('\n')}\n\nMinha sugestão: rever se vale continuar divulgando ou testar substituir por concorrentes mais atrativos.`;
}
function ansSubid(c){
  const n=c.n;
  if (!c.ts.length) return `${n}, ainda não há dados de SubID no período. Importe um relatório com a coluna Sub_id preenchida.`;
  const top = c.ts[0];
  const linhas = c.ts.slice(0,5).map((s,i)=>`${i+1}. ${s.subid} — ${fmtBRL(s.commission)} (${fmtInt(s.orders)} pedidos)`);
  return pick1([
    `${n}, sua campanha (SubID) de destaque é "${top.subid}", com ${fmtBRL(top.commission)}. Ranking:\n${linhas.join('\n')}\n\nEu investiria mais tempo e conteúdo no canal "${top.subid}".`,
    `Comparando seus canais, ${n}: "${top.subid}" lidera com ${fmtBRL(top.commission)}. Top campanhas:\n${linhas.join('\n')}\n\nVale replicar a estratégia desse SubID nos demais.`
  ]);
}
function ansMeta(c){
  const n=c.n;
  if (!S.goals.monthly) return `${n}, você ainda não definiu uma meta mensal. Vá em Metas e cadastre um valor para eu acompanhar seu progresso e calcular quanto falta por dia.`;
  const pct = (c.goalPct*100).toFixed(1);
  const falta = Math.max(S.goals.monthly - c.t.commission, 0);
  const porDia = falta/c.daysLeftMonth;
  if (c.goalPct>=1) return pick1([
    `Parabéns, ${n}! Você bateu a meta de ${fmtBRL(S.goals.monthly)}. Comissão atual: ${fmtBRL(c.t.commission)}. Que tal aumentar a meta pro próximo ciclo?`,
    `${n}, meta batida! ${fmtBRL(c.t.commission)} contra o objetivo de ${fmtBRL(S.goals.monthly)}. Próximo passo: definir uma nova meta desafiadora.`
  ]);
  const status = c.goalPct>=0.8 ? 'está muito perto' : c.goalPct>=0.5 ? 'já passou da metade' : 'ainda tem caminho pela frente';
  return pick1([
    `${n}, você ${status} — ${pct}% da meta (${fmtBRL(c.t.commission)} de ${fmtBRL(S.goals.monthly)}). Faltam ${fmtBRL(falta)}, o que dá ${fmtBRL(porDia)}/dia nos próximos ${c.daysLeftMonth} dias. Sua média atual é ${fmtBRL(c.avgDaily)}/dia.`,
    `Analisando sua meta, ${n}: ${pct}% concluída. Para chegar em ${fmtBRL(S.goals.monthly)} você precisa de ${fmtBRL(porDia)} por dia. ${c.avgDaily>=porDia?'No ritmo atual, você chega lá.':'Precisa acelerar o ritmo atual de '+fmtBRL(c.avgDaily)+'/dia.'}`
  ]);
}
function ansMelhorDia(c){
  const n=c.n;
  if (!c.best || !c.best.commission) return `${n}, ainda não tenho um dia de destaque no período.`;
  return pick1([
    `${n}, seu melhor dia foi ${fmtDateBR(c.best.key)}: ${fmtBRL(c.best.commission)} em comissão e ${fmtInt(c.best.orders)} pedidos. Vale entender o que você postou nesse dia e repetir.`,
    `Uma coisa me chamou atenção, ${n}: em ${fmtDateBR(c.best.key)} você faturou ${fmtBRL(c.best.commission)} com ${fmtInt(c.best.orders)} pedidos. Recomendo revisar posts desse dia e replicar o formato.`
  ]);
}
function ansPiorDia(c){
  const n=c.n;
  if (!c.worst) return `${n}, sem dados suficientes ainda.`;
  return `${n}, o dia mais fraco foi ${fmtDateBR(c.worst.key)} com ${fmtBRL(c.worst.commission)} e ${fmtInt(c.worst.orders)} pedidos. Vale evitar repetir o padrão desse dia e testar horários/produtos diferentes.`;
}
function ansPeriodo(c){
  const n=c.n;
  return `${n}, no período de ${fmtDateBR(c.range.start)} a ${fmtDateBR(c.range.end)}:\n• Comissão: ${fmtBRL(c.t.commission)} ${c.commDelta!==null?`(${fmtDelta(c.commDelta)})`:''}\n• Pedidos: ${fmtInt(c.t.orders)} ${c.orderDelta!==null?`(${fmtDelta(c.orderDelta)})`:''}\n• Cliques: ${fmtInt(c.t.clicks)} ${c.clickDelta!==null?`(${fmtDelta(c.clickDelta)})`:''}\n• Conversão: ${fmtPct(c.t.conv)} • Ticket: ${fmtBRL(c.t.ticket)}\n\nMinha leitura: ${c.commDelta>=0?'o período está evoluindo bem, mantenha o ritmo.':'o período pede ajustes — comece pelos produtos e criativos.'}`;
}
function ansResumo(c){
  const sc = assistantScore(c);
  const ops = assistantOpportunities(c);
  const chart = assistantChartRead(c);
  let out = `${assistantOpener(c)}\n\nSua performance geral está em ${sc.score}/100 — ${sc.label.toLowerCase()}.\n\n`;
  out += assistantSmartSummary(c);
  if (chart){
    const t = chart.trend==='crescimento'?'houve crescimento ao longo do período':chart.trend==='queda'?'houve perda de ritmo na segunda metade':'os resultados se mantiveram estáveis';
    out += `\n\nOlhando o gráfico, ${t}. Pico em ${fmtDateBR(chart.peak.key)} (${fmtBRL(chart.peak.commission)}).`;
    if (chart.concentration>0 && chart.concentration<0.25) out += ` Apenas ${chart.k} de ${chart.totalDays} dias concentram cerca de 60% da comissão.`;
  }
  const acao = ops.find(o=>o.type==='green') || ops[0];
  if (acao) out += `\n\nSugestão prioritária: ${acao.text.replace(/^[^:]+:\s*/,'')}`;
  return out;
}
function ansMelhorar(c){
  const n=c.n; const dicas = [];
  if (c.t.conv>0 && c.t.conv<0.01) dicas.push('Sua conversão está abaixo de 1% — teste produtos com mais apelo e revise as descrições dos posts.');
  if (c.clickDelta!==null && c.clickDelta<-0.1) dicas.push(`Seus cliques caíram ${Math.abs(c.clickDelta*100).toFixed(1)}% — reforce postagens, stories e grupos.`);
  if (c.commDelta!==null && c.commDelta<-0.05) dicas.push('A comissão recuou — troque parte do mix de produtos divulgados.');
  if (c.ts[0]) dicas.push(`Invista mais no SubID "${c.ts[0].subid}" — está performando bem (${fmtBRL(c.ts[0].commission)}).`);
  if (c.tp[0]) dicas.push(`Produtos como "${c.tp[0].name}" convertem bem — replique o formato desses posts.`);
  if (c.t.ticket>0 && c.t.ticket<20) dicas.push('Seu ticket médio está baixo — inclua produtos de maior valor no mix.');
  if (S.goals.monthly>0 && c.goalPct<0.5 && c.daysLeftMonth<15) dicas.push(`Faltam ${c.daysLeftMonth} dias para o fim do mês e você está em ${(c.goalPct*100).toFixed(0)}% da meta — aumente a frequência de divulgação.`);
  if (!dicas.length) dicas.push('Seus indicadores estão saudáveis — foque em escalar o que já funciona e teste 1 ou 2 produtos novos por semana.');
  return `${n}, aqui vão minhas recomendações baseadas nos seus dados:\n• ${dicas.join('\n• ')}\n\nMinha sugestão prioritária: comece pela primeira dica — costuma dar o maior retorno rápido.`;
}
function ansInvestir(c){
  const n=c.n;
  if (!c.tp[0]) return `${n}, ainda não tenho produtos suficientes para dizer onde investir. Importe mais relatórios de vendas.`;
  const p=c.tp[0];
  return `${n}, olhando os dados, "${p.name}" vale a pena escalar: já rendeu ${fmtBRL(p.commission)} em ${fmtInt(p.items)} itens. ${c.ts[0]?`Combine com o SubID "${c.ts[0].subid}" (${fmtBRL(c.ts[0].commission)}) que também está performando.`:''} Minha sugestão: dobre a frequência de divulgação nesse produto por 7 dias e compare o resultado.`;
}
function ansValorVendido(c){
  const n=c.n;
  if (!c.t.orderValue) return `${n}, ainda não encontrei valor de venda registrado no período. Importe um relatório com a coluna de valor do pedido.`;
  const cmp = c.prev && c.prev.orderValue>0 ? ` (${fmtDelta((c.t.orderValue-c.prev.orderValue)/c.prev.orderValue)} vs período anterior)` : '';
  return pick1([
    `${n}, você faturou ${fmtBRL(c.t.orderValue)} em valor vendido no período${cmp}, com ${fmtInt(c.t.orders)} pedidos e ticket médio de ${fmtBRL(c.t.ticket)}.`,
    `Olhando o total vendido, ${n}: ${fmtBRL(c.t.orderValue)}${cmp}. Isso equivale a ${fmtInt(c.t.orders)} pedidos no período.`
  ]);
}
function ansItens(c){
  const n=c.n;
  if (!c.t.items) return `${n}, ainda não tenho a quantidade de itens vendidos nesse período.`;
  return `${n}, foram ${fmtInt(c.t.items)} itens vendidos em ${fmtInt(c.t.orders)} pedidos — média de ${(c.t.items/Math.max(1,c.t.orders)).toFixed(2)} itens por pedido.`;
}
function ansRoi(c){
  const n=c.n;
  const inv = investmentInRange(c.range);
  if (!inv) return `${n}, você ainda não registrou investimento em anúncios neste período. Cadastre o valor investido na tela de Importar para eu calcular o ROI.`;
  const mult = (c.t.commission/inv);
  return `${n}, seu ROI está em ${mult.toFixed(2)}x — para cada R$ 1 investido você recebeu ${fmtBRL(mult)} de retorno em comissão. Investimento: ${fmtBRL(inv)} • Comissão: ${fmtBRL(c.t.commission)}.`;
}

function assistantAnswer(question){
  const q = (question||'').toLowerCase().trim();
  const c = assistantContext(); const n = c.n;
  if (!q) return `${n}, me faça uma pergunta! Posso falar sobre comissão, cliques, pedidos, conversão, ticket médio, produtos, SubIDs, metas e melhor dia.`;
  if (c.totalRows===0) return `${n}, ainda não tenho dados importados. Vá em Importar e envie um relatório CSV da Shopee para eu começar a analisar sua performance.`;
  if (c.totalRows<10) return `${n}, os dados importados ainda são poucos (${c.totalRows} linhas) e minha análise pode ficar limitada. Mesmo assim, sua comissão soma ${fmtBRL(c.t.commission)} e você teve ${fmtInt(c.t.orders)} pedidos até aqui. Importe um relatório maior para eu cruzar mais indicadores.`;

  const intent = detectIntent(q);
  switch(intent){
    case 'saudacao': return pick1([
      `Oi, ${n}! Como posso te ajudar com seus dados hoje? Posso analisar comissão, cliques, produtos, SubIDs, metas...`,
      `Olá, ${n}! Já dei uma olhada nos seus números. O que você quer entender melhor?`
    ]);
    case 'resumo':    return ansResumo(c);
    case 'comissao':  return ansComissao(c);
    case 'cliques':   return ansCliques(c);
    case 'pedidos':   return ansPedidos(c);
    case 'conversao': return ansConversao(c);
    case 'ticket':    return ansTicket(c);
    case 'produto':   return ansProduto(c);
    case 'fraco':     return ansFraco(c);
    case 'subid':     return ansSubid(c);
    case 'meta':      return ansMeta(c);
    case 'melhorDia': return ansMelhorDia(c);
    case 'piorDia':   return ansPiorDia(c);
    case 'periodo':   return ansPeriodo(c);
    case 'melhorar':  return ansMelhorar(c);
    case 'investir':  return ansInvestir(c);
    case 'valorVendido': return ansValorVendido(c);
    case 'itens':     return ansItens(c);
    case 'roi':       return ansRoi(c);
  }
  // fallback: nunca deixar sem resposta
  return `${n}, ainda não consegui entender exatamente o que você quis dizer. Mas posso te ajudar analisando seus dados de várias formas. Você pode perguntar sobre:\n• Comissão\n• Valor vendido\n• Cliques\n• Conversão\n• Pedidos\n• Ticket médio\n• ROI\n• Produtos campeões\n• Produtos com baixo desempenho\n• SubIDs / Campanhas\n• Melhor dia de vendas\n• Evolução e comparação de período\n• Meta do mês\n• Oportunidades de melhoria\n\nVocê quis perguntar sobre algum desses assuntos?`;
}

/* sugestões dinâmicas conforme os dados — todas com intent garantida */
function assistantSuggestions(){
  const c = assistantContext();
  const base = ['Como foi meu desempenho?','Qual meu melhor produto?','Como está minha conversão?','Qual foi meu melhor dia?','O que posso melhorar?','Quanto vendi no período?','Qual meu ticket médio?'];
  const extra = [];
  if (S.goals.monthly>0) extra.push('Estou perto da meta?');
  if (c.ts && c.ts.length) extra.push('Qual campanha teve melhor resultado?');
  if (c.tp && c.tp.length) extra.push(`Vale investir mais em "${(c.tp[0].name||'').slice(0,24)}"?`);
  if (c.commDelta!==null && c.commDelta<0) extra.push('Por que minha comissão caiu?');
  if (c.t.clicks>200 && c.t.conv>0 && c.t.conv<0.01) extra.push('Quais produtos têm cliques mas não vendem?');
  if (c.clickDelta!==null && c.clickDelta<-0.1) extra.push('Por que meus cliques caíram?');
  if (investmentInRange(c.range)>0) extra.push('Qual meu ROI?');
  const all = base.concat(extra);
  return Array.from(new Set(all)).slice(0,10);
}

  el.innerHTML = `

      <div class="flex items-center gap-3 pb-4 border-b border-slate-100">
        <div class="w-11 h-11 rounded-2xl bg-shopee-gradient text-white flex items-center justify-center shadow-pop">${icon('sparkle','w-5 h-5')}</div>
        <div class="flex-1 min-w-0">
          <div class="font-bold text-ink">Assistente Inteligente</div>
          <div class="text-xs text-ink-mute">Análise 100% local baseada nos seus dados importados</div>
        </div>
        <button id="chatClear" class="text-xs text-ink-mute hover:text-rose-600 font-medium">Limpar conversa</button>

        <form id="chatForm" class="flex items-center gap-2 bg-white border border-slate-200 rounded-2xl px-3 py-2 shadow-card focus-within:border-shopee/60">

          <button id="chatSend" type="submit" class="w-10 h-10 rounded-xl bg-shopee-gradient text-white flex items-center justify-center shadow-pop hover:opacity-90 transition disabled:opacity-40 disabled:cursor-not-allowed">${icon('send','w-4 h-4')}</button>
        </form>

    <style>

      .chat-dot { display:inline-block; width:6px; height:6px; border-radius:9999px; background:#5B4FE5; margin:0 2px; animation: chatDot 1.2s infinite ease-in-out; }
      .chat-dot:nth-child(2){ animation-delay:.15s } .chat-dot:nth-child(3){ animation-delay:.3s }
      .chat-caret::after { content:'▍'; display:inline-block; margin-left:1px; color:#5B4FE5; animation: chatDot 1s infinite; }
    </style>
  `;

  const box = el.querySelector('#chatBox');
  const input = el.querySelector('#chatInput');
  const sendBtn = el.querySelector('#chatSend');
  const scroll = ()=>{ box.scrollTop = box.scrollHeight; };
  scroll(); setTimeout(scroll,50); input.focus();

  const ANALYZE_PHRASES = [
    'Analisando seus dados',
    'Revisando seus números',
    'Cruzando cliques e comissão',
    'Verificando seus resultados',
    'Consultando seu histórico',
    'Comparando seu desempenho'
  ];

  let busy = false;
  const setBusy = (v)=>{ busy = v; sendBtn.disabled = v; input.disabled = v; };
  const wait = ms => new Promise(r=>setTimeout(r,ms));

  // ---- Naturalização das respostas: remove nome repetido + varia abertura ----
  const NAME_TRIGGERS = /(parab[ée]ns|excelente|[óo]tim[ao]|aten[cç][ãa]o|cuidado|alerta|importante|queda|caiu|recuou|precisa(mos)?|fique atento|nossa|urgente)/i;
  let botsSinceName = 99;
  let lastOpener = '';
  const OPENERS = [
    'Dei uma olhada nos seus dados',
    'Analisei esse período',
    'Encontrei um ponto interessante',
    'Tem uma boa notícia',
    'Comparando seus resultados',
    'Observando seus indicadores',
    'Revisei seus números',
    'Há uma oportunidade aqui',
    'Seu desempenho mostra que',
    'Olhando esse gráfico'
  ];
  const humanizeChunk = (text, { isFirst, index }) => {
    let out = String(text || '').trim();
    const name = firstName();
    const allowName = name && (isFirst || botsSinceName >= 5 || NAME_TRIGGERS.test(out));

    if (name && !allowName){
      // remove "Nome, " / "Nome! " / ", Nome" / "Nome:" em qualquer posição
      const nameRe = new RegExp(`\\s*,?\\s*\\b${name}\\b\\s*[,!:.]?\\s*`, 'gi');
      out = out.replace(nameRe, ' ').replace(/\s{2,}/g,' ').trim();
      // Corrige pontuação órfã no começo
      out = out.replace(/^[,;:!.\s]+/, '');
      // Recapitaliza primeira letra
      out = out.replace(/^([a-záéíóúâêôãõç])/, m=>m.toUpperCase());
      botsSinceName++;
    } else if (allowName){
      botsSinceName = 0;
    }

    // Varia abertura: se este chunk começa igual ao anterior, troca por outra
    const firstWords = out.split(/\s+/).slice(0,2).join(' ').toLowerCase();
    if (index === 0 && firstWords && firstWords === lastOpener){
      const alt = OPENERS.filter(o => !out.toLowerCase().startsWith(o.toLowerCase().slice(0,10)));
      const opener = alt[Math.floor(Math.random()*alt.length)] || 'Analisei esse período';
      // se a frase começa com maiúscula/frase completa, prefixa com opener + ": "
      out = `${opener}: ${out.charAt(0).toLowerCase()}${out.slice(1)}`;
    }
    lastOpener = out.split(/\s+/).slice(0,2).join(' ').toLowerCase();
    return out;
  };



  // Divide uma resposta longa em várias mensagens curtas (2-5 linhas cada)
  const splitAnswer = (text)=>{
    const raw = String(text||'').trim();
    if (!raw) return [];
    // Se já vem com blocos separados por linha em branco, respeita
    let blocks = raw.split(/\n\s*\n+/).map(s=>s.trim()).filter(Boolean);
    if (blocks.length === 1){
      // Quebra por sentença
      const sentences = raw.match(/[^.!?\n]+[.!?]+|\S[^.!?\n]*$/g) || [raw];
      blocks = [];
      let cur = '';
      let lines = 0;
      for (const s of sentences){
        const sTrim = s.trim(); if (!sTrim) continue;
        const addLines = (sTrim.match(/\n/g)?.length || 0) + 1;
        if (cur && (lines + addLines > 3 || (cur.length + sTrim.length) > 180)){
          blocks.push(cur.trim()); cur = sTrim; lines = addLines;
        } else {
          cur = cur ? cur + ' ' + sTrim : sTrim; lines += addLines;
        }
      }
      if (cur.trim()) blocks.push(cur.trim());
    }
    return blocks.slice(0, 6);
  };

  const showTyping = ()=>{
    const analyze = pick1(ANALYZE_PHRASES);
    box.insertAdjacentHTML('beforeend',
      `<div id="typing" class="flex items-start gap-3 slide-in">${avatarBot}
        <div class="bg-white border border-slate-100 rounded-2xl rounded-tl-sm px-4 py-3 text-sm text-ink-mute shadow-card">
          <span class="mr-2">${escapeHtml(analyze)}</span>
          <span class="chat-dot"></span><span class="chat-dot"></span><span class="chat-dot"></span>
        </div>
      </div>`);
    scroll();
  };
  const hideTyping = ()=>{ document.getElementById('typing')?.remove(); };

  const appendBotMessage = (text)=>{
    box.insertAdjacentHTML('beforeend', bubble({role:'bot', text}));
    S.chat.push({ role:'bot', text, ts:Date.now() });
    save();
    scroll();
  };

  const send = async (text)=>{
    const q = (text||'').trim(); if (!q || busy) return;
    setBusy(true);

    // 1) adiciona a pergunta do usuário ao final
    S.chat.push({ role:'user', text:q, ts:Date.now() });
    save();
    box.insertAdjacentHTML('beforeend', bubble({role:'user',text:q}));
    scroll();

    const answer = assistantAnswer(q);
    const chunks = splitAnswer(answer);

    // 2) envia cada bloco com "pensando" antes e pausa entre eles
    for (let i = 0; i < chunks.length; i++){
      showTyping();
      const think = i === 0 ? (1500 + Math.random()*1500) : (600 + Math.random()*500);
      await wait(think);
      hideTyping();
      const isFirst = i === 0 && (S.chat.filter(m=>m.role==='user').length <= 1);
      appendBotMessage(humanizeChunk(chunks[i], { isFirst, index: i }));
      if (i < chunks.length - 1) await wait(400 + Math.random()*500);
    }


    setBusy(false);
    input.focus();
    scroll();
  };

  el.querySelector('#chatForm').onsubmit = e=>{ e.preventDefault(); if (busy) return; const v=input.value; input.value=''; send(v); };
  el.querySelectorAll('[data-sugg]').forEach(b=>b.onclick=()=>{ if (!busy) send(b.dataset.sugg); });
  el.querySelector('#chatClear').onclick = ()=>{ if (busy) return; S.chat = []; save(); renderView(); };

}

/* ========================= AUTH ========================= */
const USERS_KEY = 'shopina_users';
const SESSION_KEY = 'shopina_session';
const SECRET_QUESTIONS = [
  'Qual é o segundo nome da sua mãe?',
  'Qual é o segundo nome do seu pai?',
  'Qual foi seu primeiro animal de estimação?',
  'Qual cidade você nasceu?',
  'Qual país você sonha conhecer?',
  'Qual foi o primeiro país que você visitou?',
  'Qual era seu apelido de infância?',
  'Qual foi sua primeira escola?',
  'Qual foi seu primeiro emprego?',
  'Qual era o nome do seu melhor amigo de infância?'
];
async function sha256(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const normalize = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||'').trim());
function getUsers(){ try{ return JSON.parse(localStorage.getItem(USERS_KEY)||'[]'); }catch{ return []; } }
function setUsers(u){ localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function findUser(idOrEmail){
  const n = normalize(idOrEmail);
  return getUsers().find(u => normalize(u.username)===n || normalize(u.email)===n);
}
function passwordStrength(p){
  if (!p) return {level:0,label:'',color:''};
  const hasLower=/[a-z]/.test(p), hasUpper=/[A-Z]/.test(p), hasNum=/\d/.test(p), hasSym=/[^A-Za-z0-9]/.test(p);
  if (p.length<8 || /^[A-Za-z]+$/.test(p)) return {level:1,label:'Senha fraca',color:'#EF4444'};
  if (p.length>=8 && hasUpper && hasLower && hasNum && hasSym) return {level:3,label:'Senha forte',color:'#10B981'};
  if (p.length>=8 && hasNum) return {level:2,label:'Senha média',color:'#F59E0B'};
  return {level:1,label:'Senha fraca',color:'#EF4444'};
}
function authShell(inner){
  return `<div class="min-h-screen w-full flex items-center justify-center bg-shopee-soft p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-card p-8">
      <div class="flex flex-col items-center mb-6">
        ${logoMark(56,'class="mb-3"')}
        <div class="text-lg font-bold text-ink">Shopee Analytics</div>
      </div>
      ${inner}
    </div>
  </div>`;
}
const inpCls = 'w-full h-10 px-3 pr-10 rounded-lg border border-slate-300 text-sm focus:outline-none focus:border-shopee focus:ring-1 focus:ring-shopee transition';
const btnPrimary = 'w-full h-10 rounded-lg bg-shopee-gradient text-white text-sm font-semibold hover:opacity-95 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2';
const btnGhost = 'w-full h-10 rounded-lg border border-slate-300 text-sm font-medium hover:bg-slate-50 transition';
function pwField(id, ph='Senha'){
  return `<div class="relative">
    <input id="${id}" type="password" placeholder="${ph}" class="${inpCls}"/>
    <button type="button" data-eye="${id}" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 px-1">${icon('eye','w-4 h-4')}</button>
  </div>`;
}
function bindEyes(root){
  root.querySelectorAll('[data-eye]').forEach(b=>{
    b.onclick = ()=>{ const i = root.querySelector('#'+b.dataset.eye); if(i) i.type = i.type==='password'?'text':'password'; };
  });
}
function setValid(el, ok){
  if (!el) return;
  el.classList.remove('border-emerald-500','border-rose-500','border-slate-300');
  el.classList.add(ok===true?'border-emerald-500':ok===false?'border-rose-500':'border-slate-300');
}
function withLoading(btn, fn){
  return async (e)=>{
    if (btn.disabled) return;
    const orig = btn.innerHTML; btn.disabled=true; btn.innerHTML = '<span class="inline-block w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span> Aguarde…';
    try{ await fn(e); } finally { setTimeout(()=>{ btn.disabled=false; btn.innerHTML=orig; }, 350); }
  };
}
function loginAsUser(username){
  localStorage.setItem(SESSION_KEY, JSON.stringify({username, at: new Date().toISOString()}));
  LS_KEY = 'shopina_data_'+username;
  S = load();
  try { recalcAll(); save(); } catch{}
  maybeSeedDemo();
  toast(`Bem-vindo(a), ${username}`,'ok');
  render();
}

function renderLogin(){
  const app = document.getElementById('app');
  app.className = '';
  app.innerHTML = authShell(`
    <h1 class="text-xl font-bold text-center mb-1">Entrar</h1>
    <p class="text-xs text-center text-ink-mute mb-5">Acesse sua conta</p>
    <div class="space-y-3">
      <input id="lgId" type="text" placeholder="Email ou Nome de usuário" class="${inpCls} pr-3"/>
      ${pwField('lgPw','Senha')}
      <button id="lgBtn" class="${btnPrimary}">Entrar</button>
    </div>
    <div class="flex items-center justify-between mt-4 text-xs">
      <button id="goForgot" class="text-shopee hover:underline">Esqueci minha senha</button>
      <button id="goSignup" class="text-shopee hover:underline font-medium">Criar conta</button>
    </div>
  `);
  bindEyes(app);
  const id = app.querySelector('#lgId'), pw = app.querySelector('#lgPw'), btn = app.querySelector('#lgBtn');
  id.focus();
  const submit = withLoading(btn, async ()=>{
    const u = findUser(id.value);
    if (!u){ toast('Usuário não encontrado.','err'); return; }
    const h = await sha256(pw.value);
    if (h !== u.passwordHash){ toast('Senha incorreta.','err'); return; }
    loginAsUser(u.username);
  });
  btn.onclick = submit;
  [id,pw].forEach(el=> el.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(e); }));
  app.querySelector('#goSignup').onclick = renderSignup;
  app.querySelector('#goForgot').onclick = renderForgot1;
}

function renderSignup(){
  const app = document.getElementById('app');
  app.className = '';
  const opts = SECRET_QUESTIONS.map(q=>`<option value="${q}">${q}</option>`).join('');
  app.innerHTML = authShell(`
    <h1 class="text-xl font-bold text-center mb-1">Criar Conta</h1>
    <p class="text-xs text-center text-ink-mute mb-5">Crie sua conta para começar</p>
    <div class="space-y-3">
      <input id="suUser" type="text" placeholder="Nome de usuário" class="${inpCls} pr-3"/>
      <input id="suEmail" type="email" placeholder="Email" class="${inpCls} pr-3"/>
      ${pwField('suPw','Senha')}
      <div><div id="pwBar" class="flex gap-1 h-1.5 mt-1">${'<div class="flex-1 rounded bg-slate-200"></div>'.repeat(5)}</div><div id="pwLbl" class="text-[11px] mt-1 text-ink-mute h-4"></div></div>
      ${pwField('suPw2','Confirmar senha')}
      <div id="pwMatch" class="text-[11px] h-4"></div>
      <select id="suQ" class="${inpCls} pr-3"><option value="">Selecione uma pergunta secreta</option>${opts}</select>
      ${pwField('suA','Resposta secreta')}
      <button id="suBtn" class="${btnPrimary}" disabled>Criar Conta</button>
      <button id="suCancel" class="${btnGhost}">Cancelar</button>
    </div>
  `);
  bindEyes(app);
  // secret answer field should be text by default
  const ans = app.querySelector('#suA'); ans.type='text';
  const user=app.querySelector('#suUser'), email=app.querySelector('#suEmail'),
        pw=app.querySelector('#suPw'), pw2=app.querySelector('#suPw2'),
        q=app.querySelector('#suQ'), btn=app.querySelector('#suBtn');
  user.focus();
  const bars = app.querySelectorAll('#pwBar > div');
  const lbl = app.querySelector('#pwLbl'), matchEl = app.querySelector('#pwMatch');
  function updateStrength(){
    const s = passwordStrength(pw.value);
    bars.forEach((b,i)=>{ b.style.background = i < (s.level===1?2:s.level===2?3:s.level===3?5:0) ? s.color : '#E2E8F0'; });
    lbl.textContent = s.label; lbl.style.color = s.color;
    setValid(pw, pw.value ? s.level>=2 : null);
    updateMatch();
    updateBtn();
  }
  function updateMatch(){
    if (!pw2.value){ matchEl.textContent=''; setValid(pw2,null); return; }
    if (pw.value===pw2.value){ matchEl.innerHTML = icon('check','w-3.5 h-3.5 inline -mt-0.5 mr-1')+'Senhas coincidem'; matchEl.style.color='#059669'; setValid(pw2,true); }
    else { matchEl.innerHTML = icon('x','w-3.5 h-3.5 inline -mt-0.5 mr-1')+'As senhas são diferentes'; matchEl.style.color='#DC2626'; setValid(pw2,false); }
  }
  function updateBtn(){
    const s = passwordStrength(pw.value);
    const ok = user.value.trim() && isEmail(email.value) && s.level>=2 && pw.value===pw2.value && q.value && ans.value.trim();
    btn.disabled = !ok;
  }
  pw.addEventListener('input', updateStrength);
  pw2.addEventListener('input', ()=>{ updateMatch(); updateBtn(); });
  user.addEventListener('input', ()=>{ setValid(user, user.value.trim()?true:null); updateBtn(); });
  email.addEventListener('input', ()=>{ setValid(email, email.value?isEmail(email.value):null); updateBtn(); });
  q.addEventListener('change', updateBtn);
  ans.addEventListener('input', updateBtn);
  const submit = withLoading(btn, async ()=>{
    if (!isEmail(email.value)){ toast('Informe um e-mail válido.','err'); setValid(email,false); return; }
    const users = getUsers();
    const un = normalize(user.value), en = normalize(email.value);
    if (users.some(u=>normalize(u.username)===un)){ toast('Esse nome de usuário já está em uso.','err'); return; }
    if (users.some(u=>normalize(u.email)===en)){ toast('Esse e-mail já está cadastrado.','err'); return; }
    const passwordHash = await sha256(pw.value);
    const secretAnswerHash = await sha256(normalize(ans.value));
    users.push({ username:user.value.trim(), email:email.value.trim(), passwordHash, secretQuestion:q.value, secretAnswerHash, createdAt:new Date().toISOString() });
    setUsers(users);
    toast('Conta criada com sucesso.','ok');
    setTimeout(renderLogin, 1000);
  });
  btn.onclick = submit;
  [user,email,pw,pw2,ans].forEach(el=>el.addEventListener('keydown', e=>{ if(e.key==='Enter' && !btn.disabled) submit(e); }));
  app.querySelector('#suCancel').onclick = renderLogin;
}

    </div>
  `);
  const id=app.querySelector('#fgId'), btn=app.querySelector('#fgBtn'); id.focus();
  const submit = withLoading(btn, async ()=>{
    const u = findUser(id.value);
    if (!u){ toast('Usuário não encontrado.','err'); return; }
    _forgotUser = u; renderForgot2();
  });
  btn.onclick = submit;
  id.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(e); });
  app.querySelector('#fgBack').onclick = renderLogin;

function renderForgot2(){
  const app = document.getElementById('app'); app.className='';
  app.innerHTML = authShell(`
    <h1 class="text-xl font-bold text-center mb-1">Recuperar acesso</h1>
    <p class="text-xs text-center text-ink-mute mb-5">Passo 2 de 3</p>
    <div class="space-y-3">
      <div class="text-sm text-ink-soft"><b>Pergunta:</b> ${_forgotUser.secretQuestion}</div>

function renderForgot3(){
  const app = document.getElementById('app'); app.className='';
  app.innerHTML = authShell(`
    <h1 class="text-xl font-bold text-center mb-1">Nova senha</h1>
    <p class="text-xs text-center text-ink-mute mb-5">Passo 3 de 3</p>
    <div class="space-y-3">
      ${pwField('fgPw','Nova senha')}
      <div><div id="pwBar" class="flex gap-1 h-1.5 mt-1">${'<div class="flex-1 rounded bg-slate-200"></div>'.repeat(5)}</div><div id="pwLbl" class="text-[11px] mt-1 text-ink-mute h-4"></div></div>
      ${pwField('fgPw2','Confirmar senha')}
      <div id="pwMatch" class="text-[11px] h-4"></div>
      <button id="fgBtn" class="${btnPrimary}" disabled>Salvar nova senha</button>
    </div>
  `);
  bindEyes(app);
  const pw=app.querySelector('#fgPw'), pw2=app.querySelector('#fgPw2'), btn=app.querySelector('#fgBtn');
  const bars=app.querySelectorAll('#pwBar > div'), lbl=app.querySelector('#pwLbl'), matchEl=app.querySelector('#pwMatch');
  pw.focus();
  function upd(){
    const s = passwordStrength(pw.value);
    bars.forEach((b,i)=>{ b.style.background = i < (s.level===1?2:s.level===2?3:s.level===3?5:0) ? s.color : '#E2E8F0'; });
    lbl.textContent=s.label; lbl.style.color=s.color;
    setValid(pw, pw.value ? s.level>=2 : null);
    if (!pw2.value){ matchEl.textContent=''; setValid(pw2,null); }
    else if (pw.value===pw2.value){ matchEl.innerHTML = icon('check','w-3.5 h-3.5 inline -mt-0.5 mr-1')+'Senhas coincidem'; matchEl.style.color='#059669'; setValid(pw2,true); }
    else { matchEl.innerHTML = icon('x','w-3.5 h-3.5 inline -mt-0.5 mr-1')+'As senhas são diferentes'; matchEl.style.color='#DC2626'; setValid(pw2,false); }
    btn.disabled = !(s.level>=2 && pw.value===pw2.value);
  }
  pw.addEventListener('input', upd); pw2.addEventListener('input', upd);
  const submit = withLoading(btn, async ()=>{
    const users = getUsers();
    const i = users.findIndex(u=>normalize(u.username)===normalize(_forgotUser.username));
    if (i<0){ toast('Erro ao salvar.','err'); return; }
    users[i].passwordHash = await sha256(pw.value);
    setUsers(users);
    toast('Senha alterada com sucesso.','ok');
    setTimeout(renderLogin, 1000);
  });
  btn.onclick = submit;
  [pw,pw2].forEach(el=>el.addEventListener('keydown', e=>{ if(e.key==='Enter' && !btn.disabled) submit(e); }));
}

function boot(){
  const t0 = performance.now();
  function proceed(){
    let sess=null; try{ sess = JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch{}
    if (sess && sess.username && findUser(sess.username)){
      LS_KEY = 'shopina_data_'+sess.username;
      S = load();
      try { recalcAll(); save(); } catch{}
      maybeSeedDemo();
      render();
    } else {
      localStorage.removeItem(SESSION_KEY);
      renderLogin();
    }
  }
  const elapsed = performance.now() - t0;
  setTimeout(proceed, Math.max(0, 700 - elapsed));
}
boot();
