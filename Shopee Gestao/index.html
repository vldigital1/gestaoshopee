  <style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --shopee:#5B4FE5; --shopee-mid:#7A6BF0; --shopee-light:#A79CFF; --shopee-dark:#3F35B0;

  }
  html,body{background:#F5F6FA;color:#0F172A;font-family:'Inter',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overflow-x:hidden;max-width:100vw}
  img,svg,video,canvas{max-width:100%;height:auto}

  /* ===== Mobile responsiveness (<768px) ===== */

  .scroll-thin::-webkit-scrollbar{width:8px;height:8px}
  .scroll-thin::-webkit-scrollbar-thumb{background:#E2E8F0;border-radius:8px}
  .scroll-thin::-webkit-scrollbar-thumb:hover{background:#CBD5E1}

  /* Sidebar nav */
  .nav-item{position:relative;transition:all .2s ease}
  .nav-item:hover{background:#F8FAFC;transform:translateX(2px)}
  .nav-item.active{background:linear-gradient(90deg,#F4F2FF 0%,#FFFFFF 100%);color:#5B4FE5;font-weight:600}
  .nav-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:linear-gradient(180deg,#5B4FE5,#A79CFF);border-radius:0 3px 3px 0}

  /* Cards hover */

  @keyframes si{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pop-in{animation:pi .3s cubic-bezier(.2,1.4,.4,1) both}

  /* Product thumb (placeholder premium) */

  .prod-thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 55%);pointer-events:none}
  .prod-thumb svg{position:relative;z-index:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}

  .stt{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}

  .stt-alta{background:#DCFCE7;color:#166534}

  /* Participation bar animation */
  .p-bar{position:relative;height:6px;background:#F1F5F9;border-radius:999px;overflow:hidden}
  .p-bar>span{display:block;height:100%;background:linear-gradient(90deg,#5B4FE5,#A79CFF);border-radius:999px;transform-origin:left;animation:pgrow .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes pgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  /* Product card */
  .prod-card{background:#fff;border:1px solid #F1F5F9;border-radius:18px;padding:16px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}

</style>

        <defs><linearGradient id="bootGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4433C8"/><stop offset="1" stop-color="#9C8DFF"/></linearGradient></defs>

<script>
/* =========================================================
   Shopee Analytics — 100% local (localStorage), sem backend
   LÓGICA PRESERVADA. Apenas UI premium.
   ========================================================= */

let LS_KEY = 'shopee-analytics-pro-v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const fmtBRL = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtInt = n => (Number(n)||0).toLocaleString('pt-BR');
const fmtPct = n => `${((Number(n)||0)*100).toFixed(2)}%`;
const parseBRNumber = v => {
  if (v==null) return 0;
  if (typeof v==='number') return v;
  let s = String(v).trim().replace(/[R$\s]/g,'');
  if (s==='' || s==='-') return 0;
  if (s.includes(',') && s.lastIndexOf(',') > s.lastIndexOf('.')) {
    s = s.replace(/\./g,'').replace(',','.');
  } else {
    s = s.replace(/,/g,'');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};
const parseAnyDate = v => {
  if (!v) return null;
  if (v instanceof Date) return v;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if (m){
    const [_,d,mo,y,h='0',mi='0',se='0'] = m;
    const yr = y.length===2 ? 2000+parseInt(y) : parseInt(y);
    return new Date(yr, parseInt(mo)-1, parseInt(d), +h, +mi, +se);
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m){
    const [_,y,mo,d,h='0',mi='0',se='0'] = m;
    return new Date(+y,+mo-1,+d,+h,+mi,+se);
  }
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
};
const dayKey = d => {
  const x = d instanceof Date ? d : parseAnyDate(d);
  if (!x) return null;
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
};
const fmtDateBR = k => { if(!k) return '-'; const [y,m,d]=k.split('-'); return `${d}/${m}/${y}`; };

/* --------- state --------- */
const defaultState = () => ({
  profile: { name:'Afiliado Shopee', business:'Meu Negócio', whatsapp:'', instagram:'', avatar:'' },
  imports: [],
  sales:   [],
  clicks:  [],
  daily:   [],
  products:[],
  subids:  [],
  diary:   [],
  chat:    [],
  goals:   { monthly: 0, createdAt: null, updatedAt: null },
  settings:{ period: 'yesterday', customStart:null, customEnd:null, retentionDays: 90 },
  view: 'inicio',
  demo: false
});
let S = defaultState();

function load(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultState();
    return normalizeState(JSON.parse(raw));
  } catch { return defaultState(); }
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
function normalizeState(state){
  const d = defaultState();
  const x = state && typeof state === 'object' ? state : {};
  const merged = {
    ...d,
    ...x,
    profile: { ...d.profile, ...(x.profile||{}) },
    goals: { ...d.goals, ...(x.goals||{}) },
    settings: { ...d.settings, ...(x.settings||{}) },
  };
  ['imports','sales','clicks','daily','products','subids','diary','chat'].forEach(k=>{
    if (!Array.isArray(merged[k])) merged[k] = [];
  });
  const views = ['inicio','importar','dashboard','assistente','produtos','subids','cliques','canais','calendario','diario','metas','shopeeReports','relatorios','config','perfil'];
  if (!views.includes(merged.view)) merged.view = 'inicio';
  if (!merged.settings.period) merged.settings.period = 'todos';
  merged.demo = !!merged.demo;
  return merged;
}

/* --------- Demo data (first-run seeding) --------- */
function demoFlagKey(){ return LS_KEY + '_demoSeeded'; }
function seedDemoData(){
  const products = [
    'Kit 3 Camisetas Dry Fit Masculina Academia',
    'Fone de Ouvido Bluetooth In-Ear TWS',
    'Tênis Esportivo Feminino Leve Caminhada',
    'Smartwatch D20 Y68 Relógio Inteligente',
    'Cadeira Gamer Ergonômica Reclinável',
    'Kit 5 Calcinhas Fio Dental Renda',
    'Luminária de Mesa LED Articulável USB',
    'Panela Elétrica de Arroz 6 Xícaras',
    'Mochila Escolar Impermeável Notebook',
    'Perfume Importado Contratipo 100ml'
  ];
  const subids = ['insta_stories','wpp_grupo1','tiktok_bio','bio_link','yt_desc'];
  const channels = ['Instagram','WhatsApp','TikTok','YouTube','Telegram'];
  const importId = uid();
  const today = new Date();
  const sales = [], clicks = [], daily = [];
  let dmin = null, dmax = null;
  const rnd = (a,b) => a + Math.random()*(b-a);
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  for (let i=30; i>=1; i--){
    const d = new Date(today); d.setDate(today.getDate()-i);
    const dk = dayKey(d);
    if (!dmin) dmin = dk; dmax = dk;
    // sales: 3-8 orders/day
    const orders = Math.floor(rnd(3,9));
    for (let o=0; o<orders; o++){
      const prod = pick(products);
      const items = Math.random()<0.7 ? 1 : Math.floor(rnd(2,4));
      const unit = rnd(29.9, 189.9);
      const orderValue = +(unit*items).toFixed(2);
      const commission = +(orderValue * rnd(0.06, 0.14)).toFixed(2);
      sales.push({
        importId, date: dk, hour: Math.floor(rnd(8,23)),
        product: prod, subid: pick(subids), channel: pick(channels),
        orderId: 'DEMO'+dk.replace(/-/g,'')+String(o).padStart(2,'0'),
        paymentId: '', itemsSold: items, orderValue, commission, status:'Pago'
      });
    }
    // clicks: 40-160/day distributed
    const totalClicks = Math.floor(rnd(40,160));
    const per = 8;
    for (let c=0; c<per; c++){
      clicks.push({
        importId, date: dk, hour: Math.floor(rnd(6,24)),
        subid: pick(subids), clicks: Math.floor(totalClicks/per),
        uniqueClicks: 0, source: pick(channels), referrer:'', clickId:''
      });
    }
  }
  const snapshot = {
    rows: sales.length,
    commission: sales.reduce((a,b)=>a+b.commission,0),
    orders: sales.length,
    orderValue: sales.reduce((a,b)=>a+b.orderValue,0)
  };
  S.imports = [{ id:importId, filename:'demo-shopee-analytics.csv', type:'sales',
    hash:'demo-'+importId, importedAt:new Date().toISOString(),
    rowCount: sales.length, dateMin:dmin, dateMax:dmax, adInvestment:0, snapshot, demo:true }];
  S.sales = sales;
  S.clicks = clicks;
  S.daily = daily;
  S.products = products.slice(0,6).map(name=>({id:uid(),name,category:'',link:'',subid:'',notes:'',image:''}));
  S.subids = subids.map(s=>({id:uid(),subid:s,campaign:'Campanha demo',channel:'',productRef:'',note:'Sugestão demonstrativa'}));
  S.demo = true;
  S.settings.period = 'last30';
  save();
}
function maybeSeedDemo(){
  try {
    if ((S.imports||[]).length > 0) return;
    if (localStorage.getItem(demoFlagKey()) === '1') return;
    seedDemoData();
    localStorage.setItem(demoFlagKey(), '1');
  } catch {}
}
function clearDemoData(){
  S.imports = (S.imports||[]).filter(i=>!i.demo);
  S.sales = []; S.clicks = []; S.daily = [];
  S.products = []; S.subids = [];
  S.demo = false;
  save();
}
function demoBannerHTML(){
  if (!S.demo) return '';
  return `
    <div class="mb-4 rounded-2xl border border-amber-200 bg-gradient-to-r from-amber-50 to-orange-50 px-4 py-3 flex flex-col md:flex-row md:items-center gap-3 shadow-card">
      <div class="flex items-start gap-3 flex-1 min-w-0">
        <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center shrink-0">${icon('chartbar','w-5 h-5')}</div>
        <div class="min-w-0">
          <div class="text-sm font-bold text-amber-900">Dados demonstrativos</div>
          <div class="text-xs text-amber-800/80">Esses dados são apenas exemplos para você conhecer o sistema. Importe seu relatório da Shopee para analisar seus próprios resultados.</div>
        </div>
      </div>
      <button data-nav="importar" class="shrink-0 px-4 py-2 rounded-xl text-sm font-bold text-white bg-shopee-gradient shadow-pop hover:opacity-90">Importar meus dados</button>
    </div>`;
}

/* Fonte única de verdade: sincroniza todos os buckets com S.imports.
   Remove qualquer registro órfão (sem import correspondente) e zera tudo
   quando não sobra nenhum relatório salvo. Também invalida caches. */
function recalcAll(){
  const ids = new Set((S.imports||[]).map(i=>i.id));
  if (ids.size === 0){
    S.sales = []; S.clicks = []; S.daily = [];
    // Zera filtros de período — sem relatórios não há datas válidas.
    if (S.settings){
      S.settings.customStart = null;
      S.settings.customEnd = null;
      S.settings.period = 'todos';
    }
  } else {
    S.sales  = (S.sales ||[]).filter(x=>!x.importId || ids.has(x.importId));
    S.clicks = (S.clicks||[]).filter(x=>!x.importId || ids.has(x.importId));
    S.daily  = (S.daily ||[]).filter(x=>!x.importId || ids.has(x.importId));
  }
  // Invalida caches derivados para evitar leitura de dados antigos.
  try { _calCache = { key:'', map:null }; } catch{}
  try { _calNav = null; _calNavSig = ''; } catch{}
}
function deleteImport(id){
  S.imports = (S.imports||[]).filter(x=>x.id!==id);
  S.sales   = (S.sales  ||[]).filter(x=>x.importId!==id);
  S.clicks  = (S.clicks ||[]).filter(x=>x.importId!==id);
  S.daily   = (S.daily  ||[]).filter(x=>x.importId!==id);
  recalcAll();
  save();
  render();
}

/* --------- CSV import --------- */
function hashString(s){ let h=0; for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;} return String(h); }

function detectType(headers){
  const H = headers.map(h => (h||'').toString().toLowerCase().trim());
  const has = k => H.some(h => h.includes(k));
  const hasCommission = has('comiss');
  const hasOrder = has('pedido') || has('order');
  const hasClick = has('clique') || has('click');
  const hasItem = has('item') || has('produto');
  const hasDate = has('data') || has('date') || has('dia');

  if (hasClick && !hasCommission && !hasOrder) return 'clicks';
  if (hasCommission && hasOrder && hasClick && hasDate) return 'daily';
  if (hasCommission && (hasOrder || hasItem)) return 'sales';
  if (hasClick) return 'clicks';
  if (hasCommission) return 'sales';
  return 'unknown';
}

function pick(row, keys){
  for (const k of keys){
    for (const key of Object.keys(row)){
      if (key && key.toLowerCase().includes(k)) return row[key];
    }
  }
  return null;
}

function normalizeRows(type, rows){
  const DATE_KEYS   = ['horário do pedido','horario do pedido','tempo do pedido','data do pedido','data de venda','data da venda','data','date','dia'];
  const PROD_KEYS   = ['nome do item','nome do produto','produto','item'];
  const SUB_KEYS    = ['sub_id1','sub_id 1','subid1','sub_id','subid','sub id'];
  const CHAN_KEYS   = ['canal','channel','canal de venda','canal da venda','canal de origem','origem'];
  const ORDID_KEYS  = ['id do pedido','id_pedido','order id','pedido'];
  const PAYID_KEYS  = ['id do pagamento','id_pagamento','payment id','pagamento','transaction id','id da transação','id da transacao'];
  const QTY_KEYS    = ['quantidade','itens vendidos','itens','qtd','qty'];
  const OVAL_KEYS   = ['valor de venda','valor da venda','valor do pedido','valor total','valor','preço','preco','sales amount'];
  const COMM_KEYS   = ['comissão líquida do afiliado','comissão líquida','comissao liquida','comissão do afiliado','comissão','comissao','commission'];
  const CLK_KEYS    = ['cliques','clicks','total de cliques'];
  const UCLK_KEYS   = ['cliques únicos','cliques unicos','únicos','unicos','unique clicks','unique'];
  const ORD_KEYS    = ['pedidos','orders','total de pedidos'];

  const parseHour = v => { if(v==null) return null; const m=String(v).match(/(\d{1,2}):\d{2}/); if(!m) return null; const h=parseInt(m[1],10); return (h>=0&&h<=23)?h:null; };
  if (type==='sales'){
    return rows.map(r => {
      const raw = pick(r,DATE_KEYS);
      return {
        date: dayKey(raw),
        hour: parseHour(raw),
        product: (pick(r,PROD_KEYS) || '').toString().trim(),
        subid: (pick(r,SUB_KEYS) || '').toString().trim(),
        channel: (pick(r,CHAN_KEYS) || '').toString().trim(),
        orderId: (pick(r,ORDID_KEYS) || '').toString().trim(),
        paymentId: (pick(r,PAYID_KEYS) || '').toString().trim(),
        itemsSold: parseBRNumber(pick(r,QTY_KEYS)) || 1,
        orderValue: parseBRNumber(pick(r,OVAL_KEYS)),
        commission: parseBRNumber(pick(r,COMM_KEYS)),
        status: (pick(r,['status']) || '').toString().trim(),
      };
    }).filter(r => r.date);
  }
  if (type==='clicks'){
    const cleanSub = v => {
      const s = (v||'').toString().trim();
      if (!s) return '';
      // Shopee often emits "-", "--", "N/A" as placeholder
      if (/^-+$/.test(s)) return '';
      if (/^(n\/a|na|null|none|sem)$/i.test(s)) return '';
      return s;
    };
    return rows.map(r => {
      const raw = pick(r,DATE_KEYS);
      const rawClk = pick(r,['tempo dos cliques','tempo do clique','horário do clique','horario do clique']);
      const explicitClicks = parseBRNumber(pick(r,CLK_KEYS));
      const referrer = (pick(r,['referenciador','referrer','referer','referência','referencia']) || '').toString().trim();
      const clickId = (pick(r,['id dos cliques','id do clique','click id','id_click','id']) || '').toString().trim();
      return {
        date: dayKey(rawClk || raw),
        hour: parseHour(rawClk || raw),
        subid: cleanSub(pick(r,SUB_KEYS)),
        clicks: explicitClicks || 1,
        uniqueClicks: parseBRNumber(pick(r,UCLK_KEYS)),
        source: (pick(r,['origem','canal','source']) || '').toString().trim() || referrer,
        referrer,
        clickId,
      };
    }).filter(r => r.date);
  }
  if (type==='daily'){
    return rows.map(r => ({
      date: dayKey(pick(r,DATE_KEYS)),
      clicks: parseBRNumber(pick(r,CLK_KEYS)),
      orders: parseBRNumber(pick(r,ORD_KEYS)),
      itemsSold: parseBRNumber(pick(r,QTY_KEYS)),
      orderValue: parseBRNumber(pick(r,OVAL_KEYS)),
      commission: parseBRNumber(pick(r,COMM_KEYS)),
    })).filter(r => r.date);
  }
  return [];
}

function importCSVFile(file){
  return new Promise((resolve,reject)=>{
    Papa.parse(file, {
      header:true, skipEmptyLines:true, dynamicTyping:false,
      complete: res => {
        const rows = res.data.filter(r => r && Object.keys(r).length);
        const headers = res.meta.fields || Object.keys(rows[0]||{});
        const type = detectType(headers);
        resolve({ rows, headers, type, filename: file.name, hash: hashString(file.name+'|'+rows.length+'|'+headers.join(',')) });
      },
      error: reject
    });
  });
}

function chooseImportMode(type){

              <div class="font-semibold text-ink flex items-center gap-1.5">${icon('save','w-4 h-4 text-shopee')}Atualizar meu histórico <span class="text-xs font-bold text-shopee">(Recomendado)</span></div>
              <div class="text-xs text-ink-mute">Adiciona os resultados deste relatório ao seu histórico de desempenho e atualiza automaticamente as análises detalhadas com os dados mais recentes.</div>
            </div>
          </label>
          <label class="flex gap-3 border border-slate-200 hover:border-shopee rounded-xl px-4 py-3 cursor-pointer has-[:checked]:border-shopee has-[:checked]:bg-shopee-bg/30">
            <input type="radio" name="impMode" value="replace" class="mt-1 accent-shopee"/>
            <div>
              <div class="font-semibold text-ink flex items-center gap-1.5">${icon('refresh','w-4 h-4 text-shopee')}Começar um novo histórico</div>
              <div class="text-xs text-ink-mute">Remove todos os dados salvos anteriormente e inicia um novo histórico utilizando apenas este relatório.</div>
            </div>
          </label>

        </div>
        <div class="mt-5 flex items-center justify-end gap-2">
          <button data-x class="px-4 py-2 rounded-xl text-sm font-semibold text-ink-soft hover:bg-slate-100">Cancelar</button>
          <button data-ok class="px-4 py-2 rounded-xl text-sm font-semibold bg-shopee-gradient text-white shadow-pop hover:opacity-90">Salvar relatório</button>
        </div>

      </div>`;

    const done = v => { wrap.remove(); resolve(v); };

      const sel = wrap.querySelector('input[name="impMode"]:checked');
      done(sel ? sel.value : 'accumulate');
    };
  });
}

/* ---- Progress overlay + global import runner ---- */
function showProgress(title){
  const wrap = document.createElement('div');
  wrap.className = 'fixed inset-0 z-[90] flex items-center justify-center p-4';
  wrap.innerHTML = `
    <div class="absolute inset-0 bg-black/50"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center">
      <div class="w-12 h-12 rounded-full border-4 border-shopee/20 border-t-shopee animate-spin mx-auto"></div>
      <h3 class="mt-4 text-base font-extrabold text-ink">${title||'Importando relatório...'}</h3>
      <p class="mt-1 text-sm text-ink-mute" data-step>Lendo arquivo...</p>
    </div>`;
  document.body.appendChild(wrap);
  return {
    step: t => { const s = wrap.querySelector('[data-step]'); if (s) s.textContent = t; },
    close: () => wrap.remove(),
  };
}
async function runGlobalImport(file){
  if (S.demo) { clearDemoData(); }
  let prog = showProgress('Importando relatório...');
  try {
    prog.step('Lendo arquivo...');
    await new Promise(r=>setTimeout(r,60));
    const p = await importCSVFile(file);
    if (p.type === 'unknown'){
      prog.close();
      toast('Não foi possível detectar o tipo do relatório.','err');
      return;
    }
    prog.step('Processando registros...');
    await new Promise(r=>setTimeout(r,60));
    prog.close();
    const mode = await chooseImportMode(p.type);
    if (!mode) return;
    prog = showProgress('Importando relatório...');
    prog.step('Finalizando...');
    await new Promise(r=>setTimeout(r,60));
    const result = commitImport(p, null, mode);
    prog.close();
    if (result){
      toast(mode==='replace' ? 'Relatório importado com sucesso.' : 'Relatório acumulado com sucesso.','ok');
    }
  } catch(err){
    try { prog.close(); } catch(_){}
    toast('Erro ao importar o arquivo.','err');
  }
}


/* Consolida S.sales/S.clicks antigos em S.daily (histórico leve) e libera memória.
   Regra: detalhes (produtos, subids, canais, IDs) representam apenas o último relatório. */
function foldSalesToDaily(){
  if (!S.sales.length) return;
  const byDate = new Map();
  S.daily.forEach(d => byDate.set(d.date, {...d}));
  const ordersByDate = new Map();
  S.sales.forEach(s=>{
    if(!s.date) return;
    const cur = byDate.get(s.date) || { date:s.date, clicks:0, orders:0, itemsSold:0, orderValue:0, commission:0 };
    cur.commission = (cur.commission||0) + (s.commission||0);
    cur.orderValue = (cur.orderValue||0) + (s.orderValue||0);
    cur.itemsSold  = (cur.itemsSold||0)  + (s.itemsSold||0);
    byDate.set(s.date, cur);
    if (s.orderId){
      if(!ordersByDate.has(s.date)) ordersByDate.set(s.date, new Set());
      ordersByDate.get(s.date).add(s.orderId);
    }
  });
  ordersByDate.forEach((set,date)=>{
    const cur = byDate.get(date); if(cur) cur.orders = Math.max(cur.orders||0, set.size);
  });
  S.daily = [...byDate.values()].sort((a,b)=>a.date.localeCompare(b.date));
  // Não removemos os registros de S.imports: o histórico visual e o
  // acumulado dependem do snapshot salvo em cada import.
  S.sales = [];
}
function foldClicksToDaily(){
  if (!S.clicks.length) return;
  const byDate = new Map();
  S.daily.forEach(d => byDate.set(d.date, {...d}));
  S.clicks.forEach(c=>{
    if(!c.date) return;
    const cur = byDate.get(c.date) || { date:c.date, clicks:0, orders:0, itemsSold:0, orderValue:0, commission:0 };
    cur.clicks = (cur.clicks||0) + (c.clicks||0);
    byDate.set(c.date, cur);
  });
  S.daily = [...byDate.values()].sort((a,b)=>a.date.localeCompare(b.date));
  S.clicks = [];
}

function commitImport(parsed, chosenType, mode){
  const type = chosenType || parsed.type;
  if (type==='unknown') { toast('Não foi possível detectar o tipo do relatório.','err'); return null; }
  const importId = uid();
  let norm = normalizeRows(type, parsed.rows).map(r => ({...r, importId}));
  const bucket = type==='sales' ? 'sales' : type==='clicks' ? 'clicks' : 'daily';
  let added = norm.length, skipped = 0, replaced = 0;

  if (mode==='replace'){
    // Reset completo: apaga histórico, detalhes, metas, IA, calendário — começa do zero.
    replaced = S.sales.length + S.clicks.length + S.daily.length;
    S.sales = []; S.clicks = []; S.daily = [];
    S.products = []; S.subids = []; S.diary = []; S.chat = [];
    S.imports = [];
    S.goals = { monthly: 0, createdAt: null, updatedAt: null };
  } else {
    // Acumular: histórico consolidado permanece; detalhes representam apenas o novo relatório.
    if (type==='sales'){
      replaced = S.sales.length;
      foldSalesToDaily();
    } else if (type==='clicks'){
      replaced = S.clicks.length;
      foldClicksToDaily();
    } else if (type==='daily'){
      const seen = new Set(S.daily.map(r=>r.date));
      const before = norm.length;
      norm = norm.filter(r => !seen.has(r.date));
      skipped = before - norm.length;
    }
    added = norm.length;
  }


  S[bucket].push(...norm);
  const dates = norm.map(r=>r.date).filter(Boolean).sort();
  const dmin = dates[0]||null, dmax = dates[dates.length-1]||null;
  const snapshot = summarizeNormRows(type, norm);
  S.imports.push({ id: importId, filename: parsed.filename, type, hash: parsed.hash, importedAt: new Date().toISOString(), rowCount: norm.length, dateMin:dmin, dateMax:dmax, adInvestment:0, snapshot });
  if (dmin && dmax){
    const cur = rangeForPeriod(S.settings.period);
    if (dmax < cur.start || dmin > cur.end){
      S.settings.period = 'custom';
      S.settings.customStart = dmin;
      S.settings.customEnd = dmax;
    }
  }
  save();
  const parts = [`${added} novos registros importados`];
  if (skipped) parts.push(`${skipped} duplicados ignorados`);
  if (replaced) parts.push(`${replaced} substituídos`);
  toast(`Importação (${type}): ${parts.join(', ')}.`, 'ok');
  render();
  return { norm, type, importId };
}

/* --------- aggregations --------- */
function inRange(k, start, end){ return k && k>=start && k<=end; }
function previousRange(range){
  const s = parseAnyDate(range && range.start);
  if (!range || !range.start || !range.end || !range.days || !s) {
    return { start:null, end:null, days:0 };
  }
  const prevEnd = new Date(s); prevEnd.setDate(s.getDate()-1);
  const prevStart = new Date(prevEnd); prevStart.setDate(prevEnd.getDate()-range.days+1);
  return { start:dayKey(prevStart), end:dayKey(prevEnd), days:range.days };
}
function dataDateBounds(){
  const keys = [
    ...S.sales.map(x=>x.date),
    ...S.clicks.map(x=>x.date),
    ...S.daily.map(x=>x.date),
  ].filter(Boolean).sort();
  if (!keys.length) return null;
  return { min: keys[0], max: keys[keys.length-1] };
}
function rangeForPeriod(p){
  // Sem nenhum relatório salvo: período neutro (nenhuma data antiga).
  if (!S.imports || S.imports.length === 0) return { start:null, end:null, days:0 };
  if (p==='todos' || p==='all'){
    const b = dataDateBounds();
    if (b){
      const s = parseAnyDate(b.min), e = parseAnyDate(b.max);
      const days = Math.max(1, Math.round((e-s)/86400000)+1);
      return { start: b.min, end: b.max, days };
    }
  }
  if (p==='custom'){
    let cs = S.settings.customStart, ce = S.settings.customEnd;
    const b = dataDateBounds();
    if ((!cs||!ce) && b){ cs = cs||b.min; ce = ce||b.max; }
    if (cs && ce){
      const s = parseAnyDate(cs), e = parseAnyDate(ce);
      const days = Math.max(1, Math.round((e-s)/86400000)+1);
      return { start: cs, end: ce, days };
    }
  }
  if (p==='yesterday'){
    const end = new Date(); end.setDate(end.getDate()-1); end.setHours(23,59,59,999);
    const start = new Date(end); start.setHours(0,0,0,0);
    let sk = dayKey(start), ek = dayKey(end);
    // Fallback: se não há dados em "ontem", usa o último dia disponível
    const b = dataDateBounds();
    if (b && (b.max < sk)){ sk = b.max; ek = b.max; }
    return { start: sk, end: ek, days: 1 };
  }
  const end = new Date(); end.setHours(23,59,59,999);
  const start = new Date(end);
  const map = { '7d':7, '15d':15, '30d':30, '60d':60, '90d':90 };
  const days = map[p] || 30;
  start.setDate(end.getDate()-days+1); start.setHours(0,0,0,0);
  return { start: dayKey(start), end: dayKey(end), days };
}
function totalsInRange(range){
  const salesR = S.sales.filter(s => inRange(s.date, range.start, range.end));
  const clicksR = S.clicks.filter(c => inRange(c.date, range.start, range.end));
  const dailyR = S.daily.filter(d => inRange(d.date, range.start, range.end));
  const commission = salesR.reduce((a,b)=>a+b.commission,0) + dailyR.reduce((a,b)=>a+b.commission,0);
  const orders = new Set(salesR.filter(s=>s.orderId).map(s=>s.orderId)).size || dailyR.reduce((a,b)=>a+b.orders,0);
  const items = salesR.reduce((a,b)=>a+b.itemsSold,0) + dailyR.reduce((a,b)=>a+b.itemsSold,0);
  const orderValue = salesR.reduce((a,b)=>a+b.orderValue,0) + dailyR.reduce((a,b)=>a+b.orderValue,0);
  const clicks = clicksR.reduce((a,b)=>a+b.clicks,0) + dailyR.reduce((a,b)=>a+b.clicks,0);
  const conv = clicks>0 ? orders/clicks : 0;
  const ticket = orders>0 ? orderValue/orders : 0;
  return { commission, orders, items, orderValue, clicks, conv, ticket, salesR, clicksR, dailyR };
}
function investmentInRange(range){
  // sum ad investment of imports whose date range intersects the requested range
  let total = 0;
  for (const imp of S.imports){
    const inv = imp.adInvestment||0; if (!inv) continue;
    const dmin = imp.dateMin, dmax = imp.dateMax;
    if (!dmin || !dmax){ total += inv; continue; }
    if (dmax >= range.start && dmin <= range.end) total += inv;
  }
  return total;
}
function dailySeries(range){
  const days = [];
  const s = parseAnyDate(range.start), e = parseAnyDate(range.end);
  if (!s || !e) return days;
  for (let d=new Date(s); d<=e; d.setDate(d.getDate()+1)){
    const k = dayKey(d);
    const salesR = S.sales.filter(x=>x.date===k);
    const clicksR = S.clicks.filter(x=>x.date===k);
    const dailyR = S.daily.filter(x=>x.date===k);
    days.push({
      key:k,
      commission: salesR.reduce((a,b)=>a+b.commission,0)+dailyR.reduce((a,b)=>a+b.commission,0),
      orders: new Set(salesR.filter(x=>x.orderId).map(x=>x.orderId)).size || dailyR.reduce((a,b)=>a+b.orders,0),
      clicks: clicksR.reduce((a,b)=>a+b.clicks,0)+dailyR.reduce((a,b)=>a+b.clicks,0),
    });
  }
  return days;
}
function topProducts(range, n=5, by='commission'){
  const map = new Map();
  S.sales.filter(s=>inRange(s.date, range.start, range.end)).forEach(s=>{
    const k = s.product || '(sem nome)';
    const cur = map.get(k) || { name:k, commission:0, items:0, orders:new Set() };
    cur.commission += s.commission; cur.items += s.itemsSold;
    if (s.orderId) cur.orders.add(s.orderId);
    map.set(k, cur);
  });
  return [...map.values()].map(x=>({...x, orders:x.orders.size})).sort((a,b)=>b[by]-a[by]).slice(0,n);
}
function topSubids(range, n=5){
  const map = new Map();
  S.sales.filter(s=>inRange(s.date, range.start, range.end)).forEach(s=>{
    const k = s.subid || '(sem subid)';
    const cur = map.get(k) || { subid:k, commission:0, orders:new Set() };
    cur.commission += s.commission; if (s.orderId) cur.orders.add(s.orderId);
    map.set(k, cur);
  });
  return [...map.values()].map(x=>({...x, orders:x.orders.size})).sort((a,b)=>b.commission-a.commission).slice(0,n);
}

/* --------- insights --------- */
function insights(range){
  const t = totalsInRange(range);
  const series = dailySeries(range);
  const best = series.slice().sort((a,b)=>b.commission-a.commission)[0];
  const avg = t.commission / Math.max(series.length,1);
  const list = [];
  if (best && best.commission>0) list.push(`Seu melhor dia foi ${fmtDateBR(best.key)} com ${fmtBRL(best.commission)} em comissão.`);
  if (t.orders>0) list.push(`Ticket médio do período: ${fmtBRL(t.ticket)} em ${fmtInt(t.orders)} pedidos.`);
  const invIns = (typeof investmentInRange==='function') ? investmentInRange(range) : 0;
  if (invIns>0){
    const net = t.commission - invIns;
    const roiX = t.commission/invIns;
    list.push(`ROI do período: ${roiX.toFixed(2)}x (lucro ${fmtBRL(net)} sobre ${fmtBRL(invIns)} investidos).`);
  }
  if (avg>0) list.push(`Sua média diária de comissão está em ${fmtBRL(avg)}.`);
  if (S.goals.monthly>0){
    const now = new Date(); const monthKey = dayKey(now).slice(0,7);
    const monthComm = [...S.sales,...S.daily].filter(x=>x.date && x.date.startsWith(monthKey)).reduce((a,b)=>a+(b.commission||0),0);
    const rest = Math.max(0, S.goals.monthly - monthComm);
    const daysLeft = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate() - now.getDate() + 1;
    if (rest>0) list.push(`Faltam ${fmtBRL(rest)} para bater a meta — cerca de ${fmtBRL(rest/daysLeft)}/dia nos próximos ${daysLeft} dias.`);
    else list.push(`Meta do mês batida! Total: ${fmtBRL(monthComm)}.`);
  }
  const bestSub = topSubids(range,1)[0];
  if (bestSub) list.push(`SubID mais lucrativo: ${bestSub.subid} (${fmtBRL(bestSub.commission)}).`);
  return list;
}

/* =============================================================
   PRINT / PDF REPORT — abre janela dedicada, otimizada p/ impressão.
   Não altera armazenamento. O PDF é gerado sob demanda pelo navegador.
============================================================= */
const PRINTABLE_VIEWS = {
  dashboard:'Dashboard', produtos:'Produtos Campeões', subids:'Gestão de SubIDs',
  canais:'Análise de Canais', cliques:'Análise de Cliques',
  calendario:'Calendário', metas:'Metas'
};
function channelAggForPrint(range){
  const map = new Map();
  S.sales.filter(s=>inRange(s.date, range.start, range.end)).forEach(s=>{
    const k = s.channel || '(sem canal)';
    const cur = map.get(k) || { channel:k, commission:0, orders:new Set(), items:0, orderValue:0 };
    cur.commission += s.commission||0; cur.items += s.itemsSold||0; cur.orderValue += s.orderValue||0;
    if (s.orderId) cur.orders.add(s.orderId);
    map.set(k, cur);
  });
  return [...map.values()].map(x=>({...x, orders:x.orders.size})).sort((a,b)=>b.commission-a.commission);
}
function clicksAggForPrint(range){
  const clks = S.clicks.filter(c=>inRange(c.date, range.start, range.end));
  const total = clks.reduce((a,b)=>a+(b.clicks||0),0);
  const byHour = new Array(24).fill(0);
  const byChannel = new Map(), bySub = new Map();
  clks.forEach(c=>{
    if (c.hour!=null) byHour[c.hour] += c.clicks||0;
    byChannel.set(c.source||'(sem canal)', (byChannel.get(c.source||'(sem canal)')||0)+(c.clicks||0));
    bySub.set(c.subid||'(sem subid)', (bySub.get(c.subid||'(sem subid)')||0)+(c.clicks||0));
  });
  const peak = byHour.indexOf(Math.max(...byHour));
  return {
    total, peakHour: total>0?peak:null, peakVal: byHour[peak]||0, byHour,
    byChannel: [...byChannel.entries()].map(([k,v])=>({channel:k,clicks:v})).sort((a,b)=>b.clicks-a.clicks).slice(0,10),
    bySub:     [...bySub.entries()].map(([k,v])=>({subid:k,clicks:v})).sort((a,b)=>b.clicks-a.clicks).slice(0,10),
  };
}

/* --------- UI helpers --------- */
function toast(msg, kind='ok', desc=''){
  const el = document.createElement('div');
  const grad = kind==='ok'?'linear-gradient(135deg,#10B981,#059669)'
             : kind==='warn'?'linear-gradient(135deg,#F59E0B,#D97706)'
             : 'linear-gradient(135deg,#EF4444,#B91C1C)';
  el.style.background = grad;
  el.className = `fixed top-4 right-4 z-50 text-white px-4 py-3 rounded-xl shadow-pop pop-in text-sm font-medium flex items-start gap-2 max-w-sm`;
  const descHtml = desc ? `<div class="text-xs font-normal opacity-90 mt-0.5">${desc}</div>` : '';
  el.innerHTML = `<span class="mt-0.5">${kind==='ok'?icon('checkcircle','w-4 h-4'):kind==='warn'?icon('alert','w-4 h-4'):icon('x','w-4 h-4')}</span><div><div>${msg}</div>${descHtml}</div>`;
  document.body.appendChild(el);
  const life = desc ? 4600 : 2400;
  setTimeout(()=>{el.style.transition='all .3s';el.style.opacity='0';el.style.transform='translateY(-8px)';},life);
  setTimeout(()=>el.remove(), life+400);
}

/* Custom modal confirm — replaces window.confirm with app-styled dialog */
function uiConfirm(opts, onOk, onCancel){
  const o = typeof opts === 'string' ? { title: opts } : (opts||{});
  const title = o.title || 'Confirmar ação?';
  const desc = o.desc || '';
  const okText = o.okText || 'Confirmar';
  const cancelText = o.cancelText || 'Cancelar';
  const danger = !!o.danger;
  const back = document.createElement('div');
  back.className = 'fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm';
  back.style.animation = 'fadeIn .15s ease';
  back.innerHTML = `
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 w-full max-w-md overflow-hidden" style="animation:pop .18s ease">
      <div class="p-5">
        <div class="text-lg font-bold text-ink">${escapeHtml(title)}</div>
        ${desc?`<div class="mt-2 text-sm text-ink-soft leading-relaxed">${desc}</div>`:''}
      </div>
      <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex justify-end gap-2">
        <button data-uc="cancel" class="px-4 py-2 rounded-xl text-sm font-semibold border border-slate-200 text-ink-soft hover:bg-white transition">${escapeHtml(cancelText)}</button>
        <button data-uc="ok" class="px-4 py-2 rounded-xl text-sm font-bold text-white ${danger?'bg-rose-600 hover:bg-rose-700':'bg-shopee-gradient hover:opacity-95'} transition shadow-pop">${escapeHtml(okText)}</button>
      </div>
    </div>`;
  const close = ()=>{ back.style.opacity='0'; setTimeout(()=>back.remove(),120); };
  back.addEventListener('click', e=>{
    if (e.target === back){ close(); onCancel && onCancel(); return; }
    const act = e.target.closest('[data-uc]'); if (!act) return;
    if (act.dataset.uc === 'ok'){ close(); onOk && onOk(); }
    else { close(); onCancel && onCancel(); }
  });
  document.addEventListener('keydown', function esc(ev){
    if (ev.key==='Escape'){ document.removeEventListener('keydown', esc); close(); onCancel && onCancel(); }
  });
  document.body.appendChild(back);
}

function deltaPill(cur,prev){
  if(!prev && !cur) return `<span class="delta-flat text-[11px] font-semibold px-2 py-0.5 rounded-full">—</span>`;
  if(!prev) return `<span class="delta-up text-[11px] font-semibold px-2 py-0.5 rounded-full">novo</span>`;
  const d = ((cur-prev)/prev)*100;
  const cls = d>0.5?'delta-up':d<-0.5?'delta-down':'delta-flat';
  const arrow = d>0.5?'▲':d<-0.5?'▼':'▬';
  return `<span class="${cls} text-[11px] font-semibold px-2 py-0.5 rounded-full">${arrow} ${Math.abs(d).toFixed(1)}%</span>`;
}
function sparklineSVG(values, color='#5B4FE5'){
  if(!values||values.length<2) return `<svg viewBox="0 0 100 30" class="w-full h-8"><line x1="0" y1="24" x2="100" y2="24" stroke="#E2E8F0" stroke-dasharray="3 3"/></svg>`;
  const max = Math.max(...values,1), min = Math.min(...values,0);
  const rng = max-min || 1;
  const pts = values.map((v,i)=>{
    const x = (i/(values.length-1))*100;
    const y = 28 - ((v-min)/rng)*24;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const area = `0,30 ${pts} 100,30`;
  const id = 'g'+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" class="w-full h-8">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#${id})"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function premiumCard({kind, value, sub='', delta=null, spark=null}){
  const meta = CARD_META[kind] || {icon:'trending',label:kind,tint:'from-slate-500/15 to-slate-500/5',ic:'text-slate-600'};
  return `<div class="stat-card bg-white rounded-2xl p-5 shadow-card border border-slate-100/60 slide-in">
    <div class="flex items-start justify-between mb-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${meta.tint} ${meta.ic} flex items-center justify-center">${icon(meta.icon,'w-5 h-5')}</div>
      ${delta!==null?delta:''}
    </div>
    <div class="text-[11px] uppercase tracking-wider text-ink-mute font-semibold">${meta.label}</div>
    <div class="mt-1 text-2xl font-bold text-ink tabular-nums">${value}</div>
    ${sub?`<div class="mt-1 text-[11px] text-ink-mute">${sub}</div>`:''}

}

/* ============ Bloco de comissões acumuladas (apenas importações salvas) ============ */
function computeAccumulated(){
  let commission=0, orders=0, items=0, orderValue=0;
  let last=null, lastCommission=0;
  S.imports.forEach(imp=>{
    const s = computeImportSummary(imp.id);
    if (!s) return;
    commission += s.commission||0;
    orders += s.orders||0;
    items += s.items||0;
    orderValue += s.orderValue||0;
    if (!last || new Date(imp.importedAt) > new Date(last.importedAt)){
      last = imp; lastCommission = s.commission||0;
    }
  });
  return { commission, orders, items, orderValue, count:S.imports.length, last, lastCommission };
}

/* ============ Prévia antes de salvar (não persiste nada) ============ */
function computeParsedSummary(parsed){

  const type = parsed.type;
  const rows = normalizeRows(type, parsed.rows);
  let commission=0, orderValue=0, items=0, clicks=0;
  const orderSet=new Set(), subidSet=new Set(), productSet=new Set(), channelSet=new Set();
  const dates=[];
  rows.forEach(r=>{
    if(r.date) dates.push(r.date);
    commission += r.commission||0;
    orderValue += r.orderValue||0;
    items += r.itemsSold||0;
    clicks += r.clicks||0;
    if(r.orderId) orderSet.add(r.orderId);
    if(r.subid) subidSet.add(r.subid);
    if(r.product) productSet.add(r.product);
    if(r.source) channelSet.add(r.source);
    if(type==='daily'){ if(r.orders) orderSet.add('__d'+r.date); }
  });
  dates.sort();
  const orders = type==='daily'
    ? rows.reduce((a,b)=>a+(b.orders||0),0)
    : orderSet.size;
  const totalClicks = type==='daily'
    ? rows.reduce((a,b)=>a+(b.clicks||0),0)
    : clicks;
  return { type, rows: rows.length, commission, orderValue, items,
    clicks: totalClicks, orders,
    subids: subidSet.size, products: productSet.size, channels: channelSet.size,
    dateMin: dates[0]||null, dateMax: dates[dates.length-1]||null };
}

/* ============ Import Receipt (comprovante) ============ */
function summarizeNormRows(type, rows){
  let commission=0, orderValue=0, items=0, clicks=0;
  const orderSet=new Set(), subidSet=new Set(), productSet=new Set(), channelSet=new Set();
  rows.forEach(r=>{
    commission += r.commission||0;
    orderValue += r.orderValue||0;
    items += r.itemsSold||0;
    clicks += r.clicks||0;
    if(r.orderId) orderSet.add(r.orderId);
    if(r.subid) subidSet.add(r.subid);
    if(r.product) productSet.add(r.product);
    if(r.source) channelSet.add(r.source);
  });
  const orders = type==='daily' ? rows.reduce((a,b)=>a+(b.orders||0),0) : orderSet.size;
  const totalClicks = type==='daily' ? rows.reduce((a,b)=>a+(b.clicks||0),0) : clicks;
  return { commission, orders, items, orderValue, clicks: totalClicks,
    subids: subidSet.size, products: productSet.size, channels: channelSet.size };
}
function computeImportSummary(importId){
  const imp = S.imports.find(x=>x.id===importId);
  if (!imp) return null;
  const salesR = S.sales.filter(x=>x.importId===importId);
  const clicksR = S.clicks.filter(x=>x.importId===importId);
  const dailyR  = S.daily.filter(x=>x.importId===importId);
  const hasLive = salesR.length || clicksR.length || dailyR.length;
  if (!hasLive && imp.snapshot){
    const s = imp.snapshot;
    return { imp, commission:s.commission||0, orders:s.orders||0, items:s.items||0,
      orderValue:s.orderValue||0, clicks:s.clicks||0,
      subids:s.subids||0, products:s.products||0, channels:s.channels||0,
      dateMin: imp.dateMin, dateMax: imp.dateMax, rows: imp.rowCount };
  }
  const commission = salesR.reduce((a,b)=>a+(b.commission||0),0) + dailyR.reduce((a,b)=>a+(b.commission||0),0);
  const orders = new Set(salesR.filter(s=>s.orderId).map(s=>s.orderId)).size || dailyR.reduce((a,b)=>a+(b.orders||0),0);
  const items = salesR.reduce((a,b)=>a+(b.itemsSold||0),0) + dailyR.reduce((a,b)=>a+(b.itemsSold||0),0);
  const orderValue = salesR.reduce((a,b)=>a+(b.orderValue||0),0) + dailyR.reduce((a,b)=>a+(b.orderValue||0),0);
  const clicks = clicksR.reduce((a,b)=>a+(b.clicks||0),0) + dailyR.reduce((a,b)=>a+(b.clicks||0),0);
  const subidSet = new Set([...salesR, ...clicksR].map(x=>x.subid).filter(Boolean));
  const productSet = new Set(salesR.map(x=>x.product).filter(Boolean));
  const channelSet = new Set(clicksR.map(x=>x.source).filter(Boolean));
  return { imp, commission, orders, items, orderValue, clicks,
    subids: subidSet.size, products: productSet.size, channels: channelSet.size,
    dateMin: imp.dateMin, dateMax: imp.dateMax, rows: imp.rowCount };
}

function roiStatus(net){
  if (Math.abs(net) < 0.005) return {k:'empate',l:'Empate',cls:'bg-slate-100 text-slate-700'};
  if (net > 0) return {k:'lucro',l:'Lucro',cls:'bg-emerald-100 text-emerald-700'};
  return {k:'prejuizo',l:'Prejuízo',cls:'bg-rose-100 text-rose-700'};
}

function bindReceipt(importId){
  const commit = (inp)=>{
    const imp = S.imports.find(x=>x.id===importId); if(!imp) return;
    const parsed = parseFloat(String(inp.value).replace(',','.'))||0;
    if (parsed === (imp.adInvestment||0)) return; // no change → no re-render
    imp.adInvestment = parsed;
    save();
    const host = inp.closest('.rounded-2xl');
    if (host){
      const fresh = document.createElement('div');
      fresh.innerHTML = importReceiptHTML(importId, '—');
      host.replaceWith(fresh.firstElementChild);
      bindReceipt(importId);
    }
  };
  document.querySelectorAll(`[data-inv="${importId}"]`).forEach(inp=>{
    inp.onchange = ()=>commit(inp);                    // blur / change
    inp.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); commit(inp); } };
    // NOTE: no oninput — não recalcula enquanto digita
  });
  document.querySelectorAll(`[data-analyze="${importId}"]`).forEach(b=>{
    b.onclick = (e)=>{
      e.preventDefault();
      const inp = document.querySelector(`[data-inv="${importId}"]`);
      const imp = S.imports.find(x=>x.id===importId);
      if (inp && imp){
        const parsed = parseFloat(String(inp.value).replace(',','.'))||0;
        if (parsed !== (imp.adInvestment||0)){ imp.adInvestment = parsed; save(); }
      }
      openAnalysisModal(importId);
    };
  });
}

  return {cat:'produto', grad:'linear-gradient(135deg,#5B4FE5,#A79CFF)',
    svg:'<path d="M21 8L12 3 3 8v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v10"/>'};
}
function prodThumb(name, size=56, image=''){
  const cat = guessCategory(name);
  const s = size, ic = Math.round(size*0.5);
  if (image) return `<div class="prod-thumb" style="width:${s}px;height:${s}px"><img src="${image}"/></div>`;
  return `<div class="prod-thumb" style="width:${s}px;height:${s}px;background:${cat.grad}">
    <svg viewBox="0 0 24 24" width="${ic}" height="${ic}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${cat.svg}</svg></div>`;
}
function findProductImage(name){
  const hit = (S.products||[]).find(p => p.name && name && p.name.toLowerCase()===String(name).toLowerCase());
  return hit && hit.image ? hit.image : '';
}

/* Aggregated per-product analytics for a range */
function productAgg(range){
  const map = new Map();
  S.sales.filter(s=>inRange(s.date, range.start, range.end)).forEach(s=>{
    const k = s.product || '(sem nome)';
    let cur = map.get(k);
    if (!cur){ cur = { name:k, commission:0, items:0, orders:new Set(), orderValue:0,
      subids:new Map(), days:new Map(), first:s.date, last:s.date }; map.set(k, cur); }
    cur.commission += s.commission||0;
    cur.items += s.itemsSold||0;
    cur.orderValue += s.orderValue||0;
    if (s.orderId) cur.orders.add(s.orderId);
    if (s.date){ cur.days.set(s.date, (cur.days.get(s.date)||0)+(s.commission||0));
      if (s.date < cur.first) cur.first = s.date; if (s.date > cur.last) cur.last = s.date; }
    const sub = s.subid || '(sem subid)';
    cur.subids.set(sub, (cur.subids.get(sub)||0)+(s.commission||0));
  });
  return [...map.values()].map(x=>{
    const ord = x.orders.size;
    const topSub = [...x.subids.entries()].sort((a,b)=>b[1]-a[1])[0];
    return {...x, orders:ord, ticket: ord>0 ? x.orderValue/ord : 0,
      avgPerItem: x.items>0 ? x.commission/x.items : 0,
      topSubid: topSub ? topSub[0] : '', topSubidComm: topSub ? topSub[1] : 0,
      subidList: [...x.subids.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>({subid:k,commission:v}))};
  });
}

function productStatus(pct, rank){
  if (rank===1) return {k:'campeao',l:'Campeão'};
  if (pct>=15) return {k:'alta',l:'Em alta'};
  if (pct>=5) return {k:'estavel',l:'Estável'};
  return {k:'atencao',l:'Atenção'};
}

function productInsight(p, totalComm, rank){
  const pct = totalComm>0 ? (p.commission/totalComm)*100 : 0;
  const days = p.days ? p.days.size : 0;
  if (rank===1) return `Concentrou ${pct.toFixed(1)}% da comissão do período — carro-chefe do catálogo.`;
  if (pct>=20) return `Grande peso no faturamento (${pct.toFixed(1)}%). Vale escalar a divulgação.`;
  if (p.orders>=10 && p.ticket>=100) return `Ticket médio alto (${fmtBRL(p.ticket)}). Boa margem por venda.`;
  if (p.orders<=2 && p.commission>0) return `Poucas vendas (${p.orders}). Teste novos criativos.`;
  if (days<=2 && p.commission>0) return `Vendeu em apenas ${days} dia(s) — pode ser sazonal.`;
  return `Participação de ${pct.toFixed(1)}% na comissão total.`;
}

function autoComparisons(list, label='produtos'){
  const out = [];
  if (list.length>=2){
    const [a,b] = list;
    if (b.commission>0){
      const diff = ((a.commission-b.commission)/b.commission)*100;
      if (diff>=10) out.push(`O 1º colocado faturou ${diff.toFixed(0)}% mais que o 2º.`);
    }
  }
  if (list.length>=3){
    const total = list.reduce((s,x)=>s+x.commission,0)||1;
    const top3 = list.slice(0,3).reduce((s,x)=>s+x.commission,0);
    const p = (top3/total)*100;
    if (p>=60) out.push(`Os 3 primeiros ${label} representam ${p.toFixed(0)}% da comissão — alta concentração.`);
    else if (p<=40) out.push(`Vendas bem distribuídas: os 3 primeiros ${label} somam apenas ${p.toFixed(0)}%.`);
  }
  return out;
}

            <div class="flex-1 min-w-0">
              <div class="font-semibold text-ink truncate">${escapeHtml(p.name)}</div>
              <div class="text-xs text-ink-mute truncate">${escapeHtml(p.category||'')} • SubID ${escapeHtml(p.subid||'-')}</div>
              <div class="text-xs text-ink-mute truncate">${escapeHtml(p.notes||'')}</div>
              <div class="mt-1 flex gap-2">
                ${p.link?`<a href="${p.link}" target="_blank" class="text-xs text-shopee font-semibold hover:underline">Abrir link</a>`:''}
                <button data-del-prod="${p.id}" class="text-xs text-rose-600 font-semibold hover:underline">Excluir</button>
              </div>
            </div>
          </div>`).join(''):`<div class="text-sm text-ink-mute">Nenhum produto cadastrado.</div>`}
      </div>
    </div>
  `;
  el.querySelector('#addProd').onclick = ()=>{
    const name = prompt('Nome do produto:'); if(!name) return;
    const category = prompt('Categoria:')||'';
    const link = prompt('Link:')||'';
    const subid = prompt('SubID:')||'';
    const notes = prompt('Observações:')||'';
    S.products.push({id:uid(),name,category,link,subid,notes,image:''}); save(); render();
  };
  el.querySelectorAll('[data-del-prod]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.delProd;
    uiConfirm({title:'Excluir produto?', desc:'O produto será removido da sua lista de campeões.', okText:'Excluir', danger:true}, ()=>{ S.products = S.products.filter(x=>x.id!==id); save(); render(); });
  });
}

/* SubIDs — Gestão completa por código de rastreio do afiliado */
function viewSubids(el){
  const range = rangeForPeriod(S.settings.period);
  const periodLabel = (range && range.start===range.end) ? fmtDateBR(range.start) : (range?`${fmtDateBR(range.start)} → ${fmtDateBR(range.end)}`:'—');
  const salesR = S.sales.filter(s=>inRange(s.date, range.start, range.end));

  // Aggregate by SubID
  const map = new Map();
  salesR.forEach(s=>{
    const k = (s.subid||'').trim() || '(Sem SubID)';
    const cur = map.get(k) || { subid:k, commission:0, orderValue:0, items:0,
      orders:new Set(), products:new Map() };
    cur.commission += s.commission||0;
    cur.orderValue += s.orderValue||0;
    cur.items += s.itemsSold||0;
    if (s.orderId) cur.orders.add(s.orderId);
    const pk = s.product || '—';
    const pc = cur.products.get(pk) || { product:pk, commission:0, qty:0 };
    pc.commission += s.commission||0; pc.qty += s.itemsSold||0;
    cur.products.set(pk, pc);
    map.set(k, cur);
  });
  const totalComm = [...map.values()].reduce((a,b)=>a+b.commission,0);
  const rows = [...map.values()].map(x=>({
    ...x, orders:x.orders.size,
    ticket: x.orders.size ? x.orderValue/x.orders.size : 0,
    share: totalComm ? (x.commission/totalComm)*100 : 0,
    topProducts: [...x.products.values()].sort((a,b)=>b.commission-a.commission).slice(0,5),
  })).sort((a,b)=>b.commission-a.commission);

  const champion = rows.filter(r=>r.subid!=='(Sem SubID)')[0] || rows[0];
  const totalOrders = rows.reduce((a,b)=>a+b.orders,0);

  const kpi = (label, value, tint, iconName)=>`
    <div class="bg-white rounded-2xl p-4 shadow-card border border-slate-100/60 relative overflow-hidden slide-in">
      <div class="absolute inset-0 bg-gradient-to-br ${tint} opacity-60"></div>
      <div class="relative">
        <div class="flex items-center gap-2 text-[10px] uppercase tracking-wider font-bold text-ink-mute">${icon(iconName,'w-3.5 h-3.5')} ${label}</div>
        <div class="mt-1 text-xl font-black text-ink tabular-nums">${value}</div>
      </div>
    </div>`;

  const aiTip = (r)=>{
    if (r.subid==='(Sem SubID)') return 'Muitas vendas sem SubID. Padronize sua etiqueta de rastreio para conseguir medir a origem.';
    if (r.share>=40) return `SubID dominante — ${r.share.toFixed(1)}% da comissão. Escale investimento e replique o formato criativo.`;
    if (r.share>=15) return `SubID forte — ${r.share.toFixed(1)}% da comissão. Bom candidato para testes A/B de criativos.`;
    if (r.orders>=5 && r.ticket>0) return `Ticket médio de ${fmtBRL(r.ticket)} em ${r.orders} pedidos. Foque nos produtos abaixo para escalar.`;
    if (r.orders===0) return 'Sem pedidos no período. Reavalie o criativo, a chamada ou a página de destino.';
    return 'Volume ainda baixo. Aumente exposição antes de decidir pausar ou escalar.';
  };

  // Full products (not sliced) for modal
  const fullProducts = new Map();
  [...map.entries()].forEach(([k,v])=>{
    fullProducts.set(k, [...v.products.values()].sort((a,b)=>b.commission-a.commission));
  });

  const subCard = (r, absIdx)=>{
    const i = absIdx;
    const medal = medalHtml(i+1);
    const reg = (S.subids||[]).find(x=>String(x.subid).trim().toLowerCase()===r.subid.toLowerCase());
    const all = fullProducts.get(r.subid)||[];
    const more = all.length>5;
    const stat = (icon, label, value, cls)=>`
      <div class="rounded-lg bg-slate-50 border border-slate-100 px-2 py-1.5">
        <div class="text-[9px] uppercase tracking-wider font-bold text-ink-mute flex items-center gap-1">${icon} ${label}</div>
        <div class="text-[13px] font-black tabular-nums ${cls||'text-ink'}">${value}</div>
      </div>`;
    return `<div class="bg-white rounded-2xl p-4 shadow-card border border-slate-100/60 hover:shadow-lg transition-all flex flex-col">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2 min-w-0">
          <span class="shrink-0">${medal}</span>
          <b class="text-ink truncate" title="${escapeHtml(r.subid)}">${escapeHtml(r.subid)}</b>
        </div>
        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-shopee/10 text-shopee shrink-0">${r.share.toFixed(1)}%</span>
      </div>
      ${reg?`<div class="text-[11px] text-ink-mute mb-2">${reg.channel?`Canal: <b class="text-ink-soft">${escapeHtml(reg.channel)}</b>`:''}${reg.campaign?` • ${escapeHtml(reg.campaign)}`:''}</div>`:''}
      <div class="grid grid-cols-3 gap-1.5 mb-2">
        ${stat(icon('money','w-3 h-3'),'Comissão',fmtBRL(r.commission),'text-emerald-700')}
        ${stat(icon('cart','w-3 h-3'),'Pedidos',fmtInt(r.orders))}
        ${stat(icon('box','w-3 h-3'),'Itens',fmtInt(r.items))}
        ${stat(icon('target','w-3 h-3'),'Ticket',fmtBRL(r.ticket))}
        ${stat(icon('trending','w-3 h-3'),'Vendido',fmtBRL(r.orderValue))}
        ${stat(icon('trophy','w-3 h-3'),'Rank',`#${i+1}`)}
      </div>
      <div class="h-1.5 rounded-full bg-slate-100 overflow-hidden mb-3"><div class="h-full rounded-full bg-shopee" style="width:${r.share}%"></div></div>
      ${r.topProducts.length?`<div class="pt-2 border-t border-slate-100">
        <div class="text-[10px] font-bold text-ink-mute uppercase mb-1.5">Top Produtos</div>
        ${r.topProducts.map((p,pi)=>`<div class="flex justify-between text-xs py-0.5"><span class="truncate max-w-[60%] text-ink-soft">${pi+1}. ${escapeHtml(p.product)}</span><b class="text-ink tabular-nums">${fmtBRL(p.commission)}</b></div>`).join('')}
        ${more?`<button data-all-products="${encodeURIComponent(r.subid)}" class="mt-2 text-[11px] font-semibold text-shopee hover:underline">Ver todos os ${all.length} produtos →</button>`:''}
      </div>`:''}
      <div class="mt-3 pt-3 border-t border-slate-100 text-xs text-ink-soft flex gap-2"><span class="text-shopee">${icon('bulb','w-3.5 h-3.5')}</span><span>${aiTip(r)}</span></div>
    </div>`;
  };

  // ==== state (pagination/search/sort) ====
  const state = (window.__subState = window.__subState || { q:'', sort:{key:'commission',dir:'desc'}, page:1, pageSize:10 });

  function applyFilters(){
    const term = state.q.trim().toLowerCase();
    let list = rows.filter(r=>!term || r.subid.toLowerCase().includes(term));
    const { key, dir } = state.sort;
    list.sort((a,b)=>{ const va=a[key], vb=b[key]; return dir==='asc'? (va>vb?1:va<vb?-1:0) : (vb>va?1:vb<va?-1:0); });
    return list;
  }

  function paginate(list){
    const total = list.length;
    const totalPages = Math.max(1, Math.ceil(total/state.pageSize));
    if (state.page>totalPages) state.page = totalPages;
    const start = (state.page-1)*state.pageSize;
    return { slice:list.slice(start, start+state.pageSize), total, totalPages, start };
  }

  function pagerHtml(totalPages){
    if (totalPages<=1) return '';
    const p = state.page; const pages = [];
    const push = n=>pages.push(n);
    const win = 2;
    push(1);
    if (p-win>2) pages.push('…');
    for (let i=Math.max(2,p-win); i<=Math.min(totalPages-1,p+win); i++) push(i);
    if (p+win<totalPages-1) pages.push('…');
    if (totalPages>1) push(totalPages);
    return `<div class="flex items-center gap-1 flex-wrap justify-center">
      <button data-pg="prev" ${p===1?'disabled':''} class="px-2 py-1 rounded-lg border border-slate-200 text-xs font-semibold hover:bg-slate-50 disabled:opacity-40">◀ Anterior</button>
      ${pages.map(n=>n==='…'?`<span class="px-2 text-ink-mute">…</span>`:`<button data-pg="${n}" class="min-w-[32px] px-2 py-1 rounded-lg text-xs font-semibold ${n===p?'bg-shopee text-white':'border border-slate-200 hover:bg-slate-50'}">${n}</button>`).join('')}
      <button data-pg="next" ${p===totalPages?'disabled':''} class="px-2 py-1 rounded-lg border border-slate-200 text-xs font-semibold hover:bg-slate-50 disabled:opacity-40">Próximo ▶</button>
    </div>`;
  }

  function sortArrow(key){
    if (state.sort.key!==key) return '<span class="text-slate-300">↕</span>';
    return state.sort.dir==='asc'?'<span class="text-shopee">▲</span>':'<span class="text-shopee">▼</span>';
  }

  function renderRankingTable(pageRows, startIdx){
    const th = (label, key)=>key?`<th data-sort="${key}" class="text-left px-3 py-2 font-bold text-ink-mute uppercase text-[10px] cursor-pointer hover:text-shopee select-none">${label} ${sortArrow(key)}</th>`
      :`<th class="text-left px-3 py-2 font-bold text-ink-mute uppercase text-[10px]">${label}</th>`;
    return `<div class="overflow-x-auto hidden md:block">
      <table class="w-full text-sm border-collapse">
        <thead class="bg-slate-50 border-b border-slate-200"><tr>
          ${th('#')}${th('SubID')}${th('Período')}${th('Pedidos','orders')}${th('Itens','items')}${th('Valor vendido','orderValue')}${th('Comissão','commission')}${th('Ticket médio','ticket')}${th('Participação','share')}
        </tr></thead>
        <tbody>
          ${pageRows.map((r,i)=>`<tr class="border-b border-slate-100 hover:bg-slate-50">
            <td class="px-3 py-2 tabular-nums text-ink-mute">${startIdx+i+1}</td>
            <td class="px-3 py-2 font-semibold text-ink truncate max-w-[220px]" title="${escapeHtml(r.subid)}">${escapeHtml(r.subid)}</td>
            <td class="px-3 py-2 text-ink-soft whitespace-nowrap text-xs">${periodLabel}</td>
            <td class="px-3 py-2 tabular-nums">${fmtInt(r.orders)}</td>
            <td class="px-3 py-2 tabular-nums">${fmtInt(r.items)}</td>
            <td class="px-3 py-2 tabular-nums">${fmtBRL(r.orderValue)}</td>
            <td class="px-3 py-2 tabular-nums font-bold text-emerald-700">${fmtBRL(r.commission)}</td>
            <td class="px-3 py-2 tabular-nums">${fmtBRL(r.ticket)}</td>
            <td class="px-3 py-2 tabular-nums">${r.share.toFixed(1)}%</td>
          </tr>`).join('') || `<tr><td colspan="9" class="text-center py-6 text-ink-mute">Nenhum SubID encontrado.</td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="md:hidden space-y-2">
      ${pageRows.map((r,i)=>`<div class="border border-slate-200 rounded-xl p-3 bg-white">
        <div class="flex justify-between items-center mb-1"><b class="text-ink truncate">#${startIdx+i+1} ${escapeHtml(r.subid)}</b><span class="text-[11px] font-bold text-shopee">${r.share.toFixed(1)}%</span></div>
        <div class="text-[11px] text-ink-mute mb-1">Período: <b class="text-ink-soft">${periodLabel}</b></div>
        <div class="grid grid-cols-2 gap-1 text-xs text-ink-soft"><span>Pedidos: <b>${fmtInt(r.orders)}</b></span><span>Itens: <b>${fmtInt(r.items)}</b></span><span>Comissão: <b class="text-emerald-700">${fmtBRL(r.commission)}</b></span><span>Ticket: <b>${fmtBRL(r.ticket)}</b></span><span class="col-span-2">Vendido: <b>${fmtBRL(r.orderValue)}</b></span></div>
      </div>`).join('') || `<div class="text-center py-6 text-ink-mute">Nenhum SubID encontrado.</div>`}
    </div>`;
  }

  function renderDynamic(){
    const list = applyFilters();
    const { slice, total, totalPages, start } = paginate(list);
    const cardsHost = el.querySelector('#subCards');
    const tableHost = el.querySelector('#subRanking');
    const pagerHost = el.querySelector('#subPager');
    const infoHost = el.querySelector('#subInfo');
    if (cardsHost) cardsHost.innerHTML = slice.map((r,i)=>subCard(r, start+i)).join('') || `<div class="col-span-full text-center py-10 text-ink-mute">Nenhum SubID encontrado.</div>`;
    if (tableHost) tableHost.innerHTML = renderRankingTable(slice, start);
    if (pagerHost) pagerHost.innerHTML = pagerHtml(totalPages);
    if (infoHost) infoHost.textContent = total? `${start+1} – ${Math.min(start+state.pageSize,total)} de ${total}` : '0 registros';
    // wire events
    el.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{
      const v = b.dataset.pg;
      if (v==='prev') state.page = Math.max(1, state.page-1);
      else if (v==='next') state.page = state.page+1;
      else state.page = parseInt(v,10);
      renderDynamic();
    });
    el.querySelectorAll('[data-sort]').forEach(th=>th.onclick=()=>{
      const k = th.dataset.sort;
      if (state.sort.key===k) state.sort.dir = state.sort.dir==='asc'?'desc':'asc';
      else state.sort = { key:k, dir:'desc' };
      renderDynamic();
    });
    el.querySelectorAll('[data-all-products]').forEach(b=>b.onclick=()=>{
      const key = decodeURIComponent(b.dataset.allProducts);
      const list = fullProducts.get(key)||[];
      const total = list.reduce((a,b)=>a+b.commission,0)||1;
      openModal(`<div class="p-5">
        <div class="flex items-center justify-between mb-3">
          <div><div class="text-[10px] font-bold uppercase tracking-wider text-ink-mute">SubID</div><h3 class="text-xl font-black text-ink">${escapeHtml(key)}</h3></div>
          <button onclick="closeModal()" class="text-ink-mute hover:text-ink text-2xl leading-none">×</button>
        </div>
        <div class="text-xs text-ink-mute mb-3">${list.length} produtos • Comissão total ${fmtBRL(total)}</div>
        <div class="overflow-auto max-h-[60vh]"><table class="w-full text-sm">
          <thead class="bg-slate-50 sticky top-0"><tr><th class="text-left px-3 py-2 text-[10px] uppercase font-bold text-ink-mute">#</th><th class="text-left px-3 py-2 text-[10px] uppercase font-bold text-ink-mute">Produto</th><th class="text-right px-3 py-2 text-[10px] uppercase font-bold text-ink-mute">Qtd</th><th class="text-right px-3 py-2 text-[10px] uppercase font-bold text-ink-mute">Comissão</th><th class="text-right px-3 py-2 text-[10px] uppercase font-bold text-ink-mute">%</th></tr></thead>
          <tbody>${list.map((p,i)=>`<tr class="border-b border-slate-100"><td class="px-3 py-2 text-ink-mute tabular-nums">${i+1}</td><td class="px-3 py-2 text-ink-soft">${escapeHtml(p.product)}</td><td class="px-3 py-2 text-right tabular-nums">${fmtInt(p.qty)}</td><td class="px-3 py-2 text-right tabular-nums font-bold text-emerald-700">${fmtBRL(p.commission)}</td><td class="px-3 py-2 text-right tabular-nums">${((p.commission/total)*100).toFixed(1)}%</td></tr>`).join('')}</tbody>
        </table></div>
      </div>`);
    });
  }

  el.innerHTML = `
    <div class="flex items-center justify-between mb-4 gap-2 flex-wrap">
      <div>
        <h2 class="text-2xl font-black text-ink flex items-center gap-2">${icon('tag','w-6 h-6 text-shopee')} Gestão de SubIDs</h2>
        <p class="text-sm text-ink-mute">Performance por código de rastreio do afiliado. Origem/canal em <b>Análise de Canais</b>.</p>
      </div>
    </div>

    ${rows.length===0 ? `
      <div class="bg-white rounded-2xl p-10 border border-slate-100 text-center mb-6">
        <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-shopee-bg text-shopee flex items-center justify-center">${icon('tag','w-6 h-6')}</div>
        <div class="font-bold text-ink">Sem vendas com SubID no período</div>
        <div class="text-sm text-ink-mute mt-1">Importe um relatório de vendas para ver o ranking por SubID.</div>
      </div>
    ` : `
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-5">
        ${kpi('SubIDs ativos', fmtInt(rows.length), 'from-indigo-500/15 to-indigo-500/5','tag')}
        ${kpi('SubID Campeão', champion?`<span class="block truncate text-sm md:text-base" title="${escapeHtml(champion.subid)}">${escapeHtml(champion.subid)}</span>`:'—', 'from-amber-500/15 to-amber-500/5','trophy')}
        ${kpi('Comissão Total', fmtBRL(totalComm), 'from-emerald-500/15 to-emerald-500/5','money')}
        ${kpi('Pedidos', fmtInt(totalOrders), 'from-shopee/15 to-shopee/5','cart')}
        ${kpi('Ticket Médio', fmtBRL(totalOrders?rows.reduce((a,b)=>a+b.orderValue,0)/totalOrders:0), 'from-rose-500/15 to-rose-500/5','tag')}
      </div>

      <div class="bg-white rounded-2xl p-4 md:p-5 shadow-card border border-slate-100/60 mb-5">
        <div class="flex items-center justify-between gap-3 flex-wrap mb-4">
          <h3 class="font-bold text-ink flex items-center gap-2">${icon('trophy','w-4 h-4 text-amber-500')} Ranking de SubIDs</h3>
          <div class="flex items-center gap-2 flex-wrap">
            <input id="subSearch" value="${escapeHtml(state.q)}" placeholder="Buscar SubID..." class="border border-slate-200 rounded-xl px-3 py-2 text-sm w-56 focus:outline-none focus:border-shopee/50"/>
            <label class="text-xs text-ink-mute flex items-center gap-1">Mostrar
              <select id="subPageSize" class="border border-slate-200 rounded-lg px-2 py-1 text-xs">
                ${[10,20,50,100].map(n=>`<option value="${n}" ${state.pageSize===n?'selected':''}>${n}</option>`).join('')}
              </select>
            </label>
          </div>
        </div>
        <div id="subCards" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>

      <div class="bg-white rounded-2xl p-4 md:p-5 shadow-card border border-slate-100/60 mb-5">
        <div class="flex items-center justify-between gap-3 flex-wrap mb-3">
          <h3 class="font-bold text-ink flex items-center gap-2">${icon('tag','w-4 h-4 text-shopee')} Resumo em Tabela</h3>
          <div id="subInfo" class="text-xs text-ink-mute"></div>
        </div>
        <div id="subRanking"></div>
        <div id="subPager" class="mt-4"></div>
      </div>
    `}

    <div class="bg-white rounded-2xl p-5 shadow-card border border-slate-100/60">
      <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
        <h3 class="font-bold text-ink flex items-center gap-2">${icon('tag','w-4 h-4 text-shopee')} Cadastro de SubIDs</h3>
        <div class="flex gap-2">
          <input id="qSub" placeholder="Buscar SubID..." class="border border-slate-200 rounded-xl px-3 py-2 text-sm w-56 focus:outline-none focus:border-shopee/50"/>
          <button id="addSub" class="btn-primary px-3 py-2 rounded-xl text-sm font-semibold">+ Novo SubID</button>
        </div>
      </div>
      <p class="text-xs text-ink-mute mb-3">Vincule cada SubID a um canal para que a <b>Análise de Canais</b> possa atribuir corretamente as vendas.</p>
      <div id="subList">
      ${rankTable(
        (S.subids||[]).map(s=>[s.subid,s.campaign||'-',s.channel||'-',s.productRef||'-', s.note||'-',
          `<button data-del-sub="${s.id}" class="text-rose-600 text-xs font-semibold hover:underline">Excluir</button>`]),
        ['SubID','Campanha','Canal','Produto','Nota',''])}
      </div>
    </div>
  `;

  if (rows.length){
    renderDynamic();
    const search = el.querySelector('#subSearch');
    if (search){
      search.oninput = ()=>{ state.q = search.value; state.page = 1; renderDynamic(); const pos = search.selectionStart; search.focus(); search.setSelectionRange(pos,pos); };
    }
    const ps = el.querySelector('#subPageSize');
    if (ps) ps.onchange = ()=>{ state.pageSize = parseInt(ps.value,10); state.page = 1; renderDynamic(); };
  }

  el.querySelector('#addSub').onclick = ()=>{
    const subid = prompt('SubID:'); if(!subid) return;
    const campaign = prompt('Campanha:')||'';
    const channel = prompt('Canal (Instagram, Facebook, WhatsApp, Telegram, TikTok, YouTube, Pinterest, Shopee Vídeo, Websites, Outros):')||'';
    const productRef = prompt('Produto relacionado:')||'';
    const note = prompt('Observação:')||'';
    S.subids.push({id:uid(),subid,campaign,channel,productRef,note}); save(); render();
  };
  el.querySelectorAll('[data-del-sub]').forEach(b=>b.onclick=()=>{
    S.subids = S.subids.filter(x=>x.id!==b.dataset.delSub); save(); render();
  });
  const q = el.querySelector('#qSub');
  q.oninput = ()=>{
    const term = q.value.toLowerCase();
    const filtered = (S.subids||[]).filter(s=>!term||(s.subid+s.campaign+s.channel+s.productRef).toLowerCase().includes(term));
    el.querySelector('#subList').innerHTML = rankTable(
      filtered.map(s=>[s.subid,s.campaign||'-',s.channel||'-',s.productRef||'-', s.note||'-',
        `<button data-del-sub="${s.id}" class="text-rose-600 text-xs font-semibold hover:underline">Excluir</button>`]),
      ['SubID','Campanha','Canal','Produto','Nota','']);
    el.querySelectorAll('[data-del-sub]').forEach(b=>b.onclick=()=>{S.subids=S.subids.filter(x=>x.id!==b.dataset.delSub);save();render();});
  };
}

/* Cliques */
function classifyReferrer(ref){
  const r = (ref||'').toLowerCase();
  if (!r) return 'Sem origem identificada';
  if (r.includes('t.me')||r.includes('telegram')) return 'Telegram';
  if (r.includes('whatsapp')||r.includes('wa.me')||r.includes('api.whatsapp')) return 'WhatsApp';
  if (r.includes('instagram')||r.includes('l.instagram')) return 'Instagram';
  if (r.includes('facebook')||r.includes('fb.com')||r.includes('l.facebook')) return 'Facebook';
  if (r.includes('tiktok')) return 'TikTok';
  if (r.includes('youtube')||r.includes('youtu.be')) return 'YouTube';
  if (r.includes('http')||r.includes('.com')||r.includes('.br')) return 'Websites';
  return 'Outros';
}

/* Calendário — painel diário de performance */
let _calNav = null;
let _calNavSig = '';
let _calCache = { key:'', map:null };
function calBuildIndex(){
  const sig = `${S.sales.length}|${S.daily.length}|${S.clicks.length}`;
  if (_calCache.key===sig && _calCache.map) return _calCache.map;
  const map = new Map();
  const ensure = k => { let c = map.get(k); if(!c){ c={date:k,commission:0,orderValue:0,items:0,orders:new Set(),clicks:0,products:new Map(),channels:new Map(),subids:new Map(),sales:[]}; map.set(k,c);} return c; };
  const subReg = new Map();
  (S.subids||[]).forEach(x=>{ if(x.subid) subReg.set(String(x.subid).trim().toLowerCase(), x); });
  S.sales.forEach(s=>{
    if(!s.date) return;
    const c = ensure(s.date);
    c.commission += s.commission||0;
    c.orderValue += s.orderValue||0;
    c.items += s.itemsSold||0;
    if (s.orderId) c.orders.add(s.orderId);
    c.sales.push(s);
    const pk = s.product || '—';
    const pc = c.products.get(pk) || { product:pk, commission:0, orderValue:0, orders:new Set() };
    pc.commission += s.commission||0; pc.orderValue += s.orderValue||0; if(s.orderId) pc.orders.add(s.orderId);
    c.products.set(pk, pc);
    const ch = channelFromSale(s, subReg);
    c.channels.set(ch, (c.channels.get(ch)||0)+(s.commission||0));
    const sid = (s.subid||'').trim() || 'Sem SubID';
    c.subids.set(sid, (c.subids.get(sid)||0)+(s.commission||0));
  });
  S.daily.forEach(d=>{
    if(!d.date) return;
    const c = ensure(d.date);
    c.commission += d.commission||0;
    c.clicks += d.clicks||0;
    if (!c.orders.size && d.orders) c._dailyOrders = (c._dailyOrders||0)+d.orders;
  });
  S.clicks.forEach(x=>{ if(x.date){ const c=ensure(x.date); c.clicks += x.clicks||0; } });
  _calCache = { key:sig, map };
  return map;
}
function calDay(k){
  const c = calBuildIndex().get(k);
  if(!c) return { date:k, commission:0, orderValue:0, items:0, orders:0, clicks:0, products:[], channels:[], subids:[], sales:[] };
  const orders = c.orders.size || c._dailyOrders || 0;
  return {
    date:k, commission:c.commission, orderValue:c.orderValue, items:c.items,
    orders, clicks:c.clicks,
    products:[...c.products.values()].map(p=>({...p,orders:p.orders.size})).sort((a,b)=>b.commission-a.commission),
    channels:[...c.channels.entries()].map(([name,commission])=>({name,commission})).sort((a,b)=>b.commission-a.commission),
    subids:[...c.subids.entries()].map(([subid,commission])=>({subid,commission})).sort((a,b)=>b.commission-a.commission),
    sales:c.sales
  };
}

/* Metas */
function brlMaskFromDigits(digits){
  const d = (digits||'').replace(/\D/g,'') || '0';
  const cents = parseInt(d,10);
  return (cents/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function brlMaskToNumber(str){
  const d = (str||'').replace(/\D/g,'') || '0';
  return parseInt(d,10)/100;
}
function attachBRLMask(input, initialValue){
  if (!input) return;
  const set = v => { input.value = brlMaskFromDigits(String(Math.round((v||0)*100))); };
  set(initialValue||0);
  input.addEventListener('input', ()=>{ input.value = brlMaskFromDigits(input.value); });
  input.addEventListener('focus', ()=>{ setTimeout(()=>input.setSelectionRange(input.value.length,input.value.length),0); });
}
function animateCountUp(root){
  root.querySelectorAll('[data-count]').forEach(node=>{
    const target = parseFloat(node.getAttribute('data-count'))||0;
    const kind = node.getAttribute('data-count-kind')||'brl';
    const dur = 700; const start = performance.now();
    const fmt = v => kind==='int' ? fmtInt(Math.round(v)) : kind==='pct' ? (v.toFixed(1)+'%') : fmtBRL(v);
    function frame(t){
      const p = Math.min(1,(t-start)/dur);
      const eased = 1-Math.pow(1-p,3);
      node.textContent = fmt(target*eased);
      if (p<1) requestAnimationFrame(frame);
      else node.textContent = fmt(target);
    }
    requestAnimationFrame(frame);
  });
  root.querySelectorAll('[data-bar]').forEach(node=>{
    const w = parseFloat(node.getAttribute('data-bar'))||0;
    node.style.width = '0%';
    requestAnimationFrame(()=>{ node.style.width = Math.min(100,Math.max(0,w))+'%'; });
  });
}

function viewMetas(el){
  const now = new Date();
  const monthKey = dayKey(now).slice(0,7);
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const dayOfMonth = now.getDate();
  const daysLeft = Math.max(1, daysInMonth - dayOfMonth + 1);
  const daysElapsed = Math.max(1, dayOfMonth);

  const monthSales = S.sales.filter(x=>x.date && x.date.startsWith(monthKey));
  const monthDaily = S.daily.filter(x=>x.date && x.date.startsWith(monthKey));
  const monthComm = [...monthSales,...monthDaily].reduce((a,b)=>a+(b.commission||0),0);
  const monthOrders = new Set(monthSales.filter(x=>x.orderId).map(x=>x.orderId)).size
                    + monthDaily.reduce((a,b)=>a+(b.orders||0),0);

  // Mês anterior (para comparativo IA)
  const prevMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const prevMonthKey = dayKey(prevMonthDate).slice(0,7);
  const prevMonthSales = S.sales.filter(x=>x.date && x.date.startsWith(prevMonthKey));
  const prevMonthDaily = S.daily.filter(x=>x.date && x.date.startsWith(prevMonthKey));
  const prevMonthComm = [...prevMonthSales,...prevMonthDaily].reduce((a,b)=>a+(b.commission||0),0);
  const prevSameDayComm = [...prevMonthSales,...prevMonthDaily]
    .filter(x=>{ const d = parseInt((x.date||'').slice(8,10),10); return d>0 && d<=dayOfMonth; })
    .reduce((a,b)=>a+(b.commission||0),0);

  // Série diária do mês (para tendência e melhor dia)
  const byDay = {};
  [...monthSales,...monthDaily].forEach(x=>{
    if(!x.date) return;
    byDay[x.date] = (byDay[x.date]||0) + (x.commission||0);
  });
  const dayEntries = Object.entries(byDay).sort((a,b)=>a[0].localeCompare(b[0]));
  const bestDay = dayEntries.reduce((a,b)=> b[1]>(a?.[1]||0)?b:a, null);
  const last5 = dayEntries.slice(-5).reduce((a,b)=>a+b[1],0);
  const prev5 = dayEntries.slice(-10,-5).reduce((a,b)=>a+b[1],0);
  const trendDir = last5>prev5*1.05?'up':last5<prev5*0.95?'down':'flat';

  const goal = S.goals.monthly||0;
  const rest = Math.max(0, goal - monthComm);
  const pct = goal>0? Math.min(100,(monthComm/goal)*100):0;
  const ticket = monthOrders>0? monthComm/monthOrders : 0;
  const avgDaily = monthComm/daysElapsed;
  const neededDaily = goal>0 ? rest/daysLeft : 0;
  const idealDaily  = goal>0 ? goal/daysInMonth : 0;
  const diffDaily   = avgDaily - neededDaily;
  const projection  = avgDaily * daysInMonth;
  const projPct     = goal>0 ? Math.min(100,(projection/goal)*100) : 0;
  const ordersNeeded = ticket>0? Math.ceil(rest/ticket):0;

  // Ritmo: % do dia ideal executado hoje (média) vs 100% (ideal)
  const paceIdealPct = 100;
  const paceActualPct = idealDaily>0 ? Math.min(200,(avgDaily/idealDaily)*100) : 0;

  // Probabilidade (heurística com base na projeção)
  let probability = 0;
  if (goal>0){
    if (projection>=goal) probability = Math.min(99, 70 + (projection/goal-1)*100);
    else probability = Math.max(1, (projection/goal)*70);
  }

  // Mensagem diagnóstica inteligente
  let diagIcon=icon('target','w-4 h-4'), diagTitle='Sem meta definida', diagText='Defina uma meta para começar a acompanhar sua evolução.', diagBg='from-slate-500/10 to-slate-500/0';
  if (goal>0){
    if (pct>=100){ diagIcon=icon('flame','w-4 h-4'); diagTitle='Excelente desempenho!'; diagText='Você já ultrapassou sua meta mensal.'; diagBg='from-emerald-500/15 to-emerald-500/0'; }
    else if (projPct>=110){ diagIcon=icon('checkcircle','w-4 h-4'); diagTitle='Excelente!'; diagText='Você está acima da projeção mensal. Continue nesse ritmo.'; diagBg='from-emerald-500/15 to-emerald-500/0'; }
    else if (projPct>=95){ diagIcon=icon('checkcircle','w-4 h-4'); diagTitle='Muito bom!'; diagText='Você está no caminho certo para atingir sua meta.'; diagBg='from-emerald-500/10 to-emerald-500/0'; }
    else if (projPct>=80){ diagIcon=icon('alert','w-4 h-4'); diagTitle='Atenção'; diagText='Você está um pouco abaixo da média necessária. Ainda é possível recuperar.'; diagBg='from-amber-500/15 to-amber-500/0'; }
    else if (projPct>=60){ diagIcon=icon('alert','w-4 h-4'); diagTitle='Atenção'; diagText=`Será necessário aumentar sua média diária em ${fmtBRL(Math.max(0,-diffDaily))} para atingir a meta.`; diagBg='from-orange-500/15 to-orange-500/0'; }
    else { diagIcon=icon('alert','w-4 h-4'); diagTitle='Risco'; diagText='Mantendo o ritmo atual, você provavelmente não alcançará sua meta este mês.'; diagBg='from-rose-500/15 to-rose-500/0'; }
